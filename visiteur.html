<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Défi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg-deep: #12183c;
  --ink: #f5f6fa;
  --ink-dim: rgba(245, 246, 250, 0.62);
  --metal-1: #ffffff;
  --metal-2: #d7dbe6;
  --metal-3: #9aa1b5;
  --field-bg: rgba(6, 9, 26, 0.38);
  --field-border: rgba(255, 255, 255, 0.16);
  --danger: #ff9090;
  --success: #8be6a8;
  --glass-bg: rgba(255, 255, 255, 0.07);
  --font-display: "Manrope", "Segoe UI", sans-serif;
  --font-body: "Inter", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);

  background-image:
    radial-gradient(ellipse at center, rgba(10, 13, 34, 0) 40%, rgba(6, 8, 24, 0.55) 100%),
    url("background.png");
  background-color: var(--bg-deep);
  background-repeat: no-repeat;
  background-position: center center;
  background-size: cover;
  background-attachment: fixed;

  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.scene {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}

.panel {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.proof-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(6, 9, 26, 0.55);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.18s ease, visibility 0.18s ease;
  z-index: 25;
}

.proof-backdrop.open {
  opacity: 1;
  visibility: visible;
}

.proof-trigger {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logout-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 18px;
  border: none;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--metal-1) 0%, var(--metal-2) 45%, var(--metal-3) 100%);
  color: #1c2138;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13.5px;
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    0 8px 18px -8px rgba(0, 0, 0, 0.55);
  transition: filter 0.15s ease, transform 0.1s ease;
}

.logout-btn:hover { filter: brightness(1.05); }
.logout-btn:active { transform: translateY(1px); }

.eyebrow {
  margin: 0 0 10px;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--metal-2);
}

.defi-titre {
  margin: 0 0 12px;
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 800;
  line-height: 1.35;
  max-width: 360px;
}

.defi-montant {
  margin: 0 0 26px;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--metal-2);
}

.timer {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 46px;
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
  margin: 0 0 32px;
  color: var(--ink);
}

.timer--attente {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-dim);
  letter-spacing: normal;
}

.cta {
  padding: 15px 30px;
  border: none;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--metal-1) 0%, var(--metal-2) 45%, var(--metal-3) 100%);
  color: #1c2138;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14.5px;
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    0 10px 24px -8px rgba(0, 0, 0, 0.55);
  transition: filter 0.15s ease, transform 0.1s ease;
}

.cta:hover { filter: brightness(1.04); }
.cta:active { transform: translateY(1px); }

.proof-done {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 13px 26px;
  border-radius: 999px;
  background: rgba(139, 230, 168, 0.14);
  border: 1px solid rgba(139, 230, 168, 0.4);
  color: var(--success);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
}

.proof-echec {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 13px 26px;
  border-radius: 999px;
  background: rgba(255, 144, 144, 0.14);
  border: 1px solid rgba(255, 144, 144, 0.4);
  color: var(--danger);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
}

.proof-panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(420px, 90vw);
  padding: 22px;
  border-radius: 20px;
  background: var(--glass-bg);
  border: 1px solid var(--field-border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 16px;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.18s ease, visibility 0.18s ease;
  z-index: 30;
}

.proof-panel.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field__label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--ink-dim);
  text-transform: uppercase;
}

.field input[type="text"],
.field input[type="url"] {
  width: 100%;
  padding: 13px 14px;
  border-radius: 12px;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
}

.field input[readonly] {
  color: var(--ink-dim);
}

.field input:focus {
  border-color: var(--metal-2);
}

.paste-zone {
  border: 1.5px dashed var(--field-border);
  border-radius: 14px;
  padding: 22px 16px;
  text-align: center;
  font-size: 13px;
  color: var(--ink-dim);
  cursor: text;
  transition: border-color 0.15s ease, background 0.15s ease;
  outline: none;
}

.paste-zone:focus,
.paste-zone.has-image {
  border-color: var(--metal-2);
  background: rgba(255, 255, 255, 0.04);
}

.paste-zone img {
  max-width: 100%;
  max-height: 160px;
  border-radius: 10px;
  display: block;
  margin: 0 auto;
}

.proof-defi-titre {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 15px;
  color: var(--ink);
}

.map-toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}

.map-toolbar input {
  flex: 1;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
  color: var(--ink);
  font-size: 12.5px;
  outline: none;
}

.map-style-btn {
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--field-border);
  background: transparent;
  color: var(--ink-dim);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  cursor: pointer;
}

.map-style-btn.active {
  background: var(--metal-2);
  color: #1c2138;
  border-color: var(--metal-2);
}

.map-wrap {
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--field-border);
}

#map {
  height: 200px;
  width: 100%;
}

.map-hint {
  margin: 8px 0 0;
  font-size: 11.5px;
  color: var(--ink-dim);
}

.map-hint--ok {
  color: var(--success);
}

.submit-btn {
  padding: 13px 16px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(180deg, var(--metal-1) 0%, var(--metal-2) 45%, var(--metal-3) 100%);
  color: #1c2138;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
}

.submit-btn:disabled { opacity: 0.6; cursor: progress; }

.form-message {
  font-size: 13px;
  margin: 0;
}

.form-message--error { color: var(--danger); }
.form-message--success { color: var(--success); }

@media (max-width: 460px) {
  .timer { font-size: 34px; }
  .defi-titre { font-size: 20px; }
}
</style>
</head>
<body>

  <button id="logout-btn" class="logout-btn" type="button">Déconnexion</button>

  <div class="scene">
    <main class="panel" role="main">

      <p class="eyebrow">Défi</p>
      <h1 class="defi-titre" id="defi-titre">Chargement du défi…</h1>
      <div class="defi-montant" id="defi-montant"></div>
      <div class="timer" id="timer">00:00:00</div>

      <div class="proof-trigger" id="proof-trigger">
        <button class="cta" id="toggle-proof-btn" type="button">Ajouter ma preuve</button>
        <div class="proof-done" id="proof-done" hidden>✓ Preuve envoyée</div>
        <div class="proof-echec" id="proof-echec" hidden>✕ Échec</div>

        <form class="proof-panel" id="proof-form">
          <div class="field">
            <span class="field__label">Défi</span>
            <p class="proof-defi-titre" id="proof-titre"></p>
          </div>

        <label class="field">
          <span class="field__label">Lien vidéo</span>
          <input type="url" id="proof-lien" placeholder="https://...">
        </label>

        <div class="field">
          <span class="field__label">Image (Ctrl+V pour coller)</span>
          <div class="paste-zone" id="paste-zone" tabindex="0">
            Cliquez ici puis collez votre image (Ctrl+V)
          </div>
        </div>

        <div class="field">
          <span class="field__label">Lieu du défi (obligatoire)</span>
          <div class="map-toolbar">
            <input type="text" id="map-search" placeholder="Rechercher un lieu ou x,y...">
            <button type="button" class="map-style-btn active" data-style="atlas">Atlas</button>
            <button type="button" class="map-style-btn" data-style="satellite">Satellite</button>
          </div>
          <div class="map-wrap">
            <div id="map"></div>
          </div>
          <p class="map-hint" id="map-hint">Cliquez sur la carte pour indiquer l'endroit</p>
        </div>

        <p id="form-message" class="form-message" hidden></p>

        <button type="submit" class="submit-btn" id="submit-proof-btn">Envoyer</button>
        </form>
      </div>

    </main>
  </div>

  <div class="proof-backdrop" id="proof-backdrop"></div>

  <script type="module" src="visiteur.js?v=5"></script>
</body>
</html>
