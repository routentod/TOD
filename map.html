<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte — GTA V</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg: #0b0d10;
    --panel: #14171c;
    --panel-border: #262b33;
    --text: #e7e9ec;
    --text-dim: #8b93a1;
    --accent: #f2c94c;
    --accent-dim: #9c8433;
    --danger: #e05555;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow:hidden;
  }

  #map{ position:absolute; inset:0; background:#05060a; }

  /* ---- Bandeau haut ---- */
  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; gap:12px;
    padding:12px 16px;
    background:linear-gradient(180deg, rgba(11,13,16,.95), rgba(11,13,16,0));
    pointer-events:none;
  }
  #topbar > *{ pointer-events:auto; }
  #title{
    font-weight:700; letter-spacing:.5px; font-size:15px;
    color:var(--accent); text-transform:uppercase;
    white-space:nowrap;
  }
  #search{
    flex:1; max-width:360px;
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:8px; padding:8px 12px;
  }
  #search input{
    flex:1; background:transparent; border:none; outline:none;
    color:var(--text); font-size:13px;
  }
  #search input::placeholder{ color:var(--text-dim); }
  #search button{
    background:none; border:none; color:var(--text-dim);
    cursor:pointer; font-size:13px;
  }
  #search button:hover{ color:var(--accent); }

  /* ---- Panneau styles de carte ---- */
  #stylePanel{
    position:absolute; top:64px; right:16px; z-index:1000;
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:10px; padding:6px; display:flex; gap:6px;
  }
  #stylePanel button{
    background:transparent; border:1px solid transparent;
    color:var(--text-dim); font-size:12px; font-weight:600;
    padding:7px 12px; border-radius:7px; cursor:pointer;
    letter-spacing:.3px; text-transform:uppercase;
  }
  #stylePanel button.active{
    background:var(--accent); color:#1a1400; border-color:var(--accent);
  }
  #stylePanel button:not(.active):hover{ color:var(--text); border-color:var(--panel-border); }

  /* ---- Panneau blips (bas gauche) ---- */
  #blipPanel{
    position:absolute; bottom:16px; left:16px; z-index:1000;
    width:260px; max-height:40vh;
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:10px; display:flex; flex-direction:column; overflow:hidden;
  }
  #blipPanel header{
    padding:10px 12px; font-size:12px; font-weight:700;
    color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px;
    border-bottom:1px solid var(--panel-border);
    display:flex; justify-content:space-between; align-items:center;
  }
  #blipPanel header span.hint{ font-weight:400; text-transform:none; font-size:11px; }
  #blipList{ overflow-y:auto; }
  .blip-item{
    padding:8px 12px; font-size:13px; display:flex; justify-content:space-between;
    align-items:center; border-bottom:1px solid var(--panel-border); cursor:pointer;
  }
  .blip-item:hover{ background:#1c2027; }
  .blip-item .del{ color:var(--text-dim); font-size:12px; }
  .blip-item .del:hover{ color:var(--danger); }
  #blipList:empty::after{
    content:"Clique sur la carte pour poser un blip"; display:block;
    padding:14px 12px; font-size:12px; color:var(--text-dim);
  }

  /* ---- Coordonnées bas droite ---- */
  #coords{
    position:absolute; bottom:16px; right:16px; z-index:1000;
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:8px; padding:8px 12px; font-size:12px;
    color:var(--text-dim); font-variant-numeric:tabular-nums;
  }
  #coords b{ color:var(--accent); }

  /* ---- Popup Leaflet custom ---- */
  .leaflet-popup-content-wrapper{ background:var(--panel); color:var(--text); border-radius:8px; }
  .leaflet-popup-tip{ background:var(--panel); }
  .leaflet-container a.leaflet-popup-close-button{ color:var(--text-dim); }

  /* ---- Message tuiles manquantes ---- */
  #tileNotice{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:900; text-align:center; color:var(--text-dim);
    font-size:13px; max-width:320px; display:none; pointer-events:none;
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="tileNotice">
  Aucune tuile chargée pour ce style.<br>
  Dépose tes tuiles dans <code>/tiles/&lt;style&gt;/{z}/{x}/{y}.png</code>
</div>

<div id="topbar">
  <div id="title">Carte · Los Santos</div>
  <div id="search">
    <input id="searchInput" type="text" placeholder="Rechercher un lieu ou des coords (x,y)...">
    <button id="searchBtn">→</button>
  </div>
</div>

<div id="stylePanel">
  <button data-style="atlas" class="active">Atlas</button>
  <button data-style="satellite">Satellite</button>
</div>

<div id="blipPanel">
  <header><span>Blips</span><span class="hint">clic droit = supprimer tout</span></header>
  <div id="blipList"></div>
</div>

<div id="coords">X: <b id="cx">0</b> &nbsp; Y: <b id="cy">0</b></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =========================================================
   CONFIG — à adapter selon tes tuiles (issues du repo
   RiceaRaul/gta-v-map-leaflet, dossier "map styles" à
   extraire depuis le lien Mega du README dans /tiles/)
   ========================================================= */
const TILE_SIZE   = 256;
const MIN_ZOOM    = -2;
const MAX_ZOOM    = 5;

// Nombre de tuiles par côté au niveau de zoom le plus détaillé (MAX_ZOOM).
// Convention standard : 2^MAX_ZOOM (donc 32 pour MAX_ZOOM=5). Si la carte ne
// remplit pas bien l'écran ou semble décalée, ouvre le dossier
// mapStyles/styleAtlas/5/ et compte le nombre de sous-dossiers (x) présents,
// puis mets cette valeur ici.
const TILES_AT_MAX_ZOOM = 32;

// Structure réelle du dossier extrait depuis le Mega du repo RiceaRaul :
// mapStyles/style<Nom>/{z}/{x}/{y}.jpg
// -> place le dossier "mapStyles" à côté de ce fichier map.html (ou adapte le chemin ci-dessous)
const STYLES = {
  atlas:     'mapStyles/styleAtlas/{z}/{x}/{y}.jpg',
  satellite: 'mapStyles/styleSatelite/{z}/{x}/{y}.jpg'
};

// Couleur de fond de la carte selon le style actif (visible entre/derrière les tuiles)
const STYLE_BG = {
  atlas:     '#0FA8D2',
  satellite: '#153E6A'
};

// Quelques lieux connus pour la recherche (coordonnées en repère Leaflet CRS.Simple,
// PAS les coordonnées in-game GTA — ajuste selon le calage de tes tuiles)
// Niveau de zoom utilisé quand on saute sur un lieu ou des coordonnées via la recherche
// (assez proche de MAX_ZOOM pour vraiment zoomer, pas juste recentrer)
const SEARCH_ZOOM = MAX_ZOOM;

// Liste des lieux de GTA V, avec les coordonnées relevées sur la carte.
const PLACES = {
  // --- Los Santos : quartiers ---
  "los santos":             { x: 115, y: -197 },
  "vinewood":               { x: 125, y: -170 },
  "vinewood hills":         { x: 111, y: -154 },
  "richman":                { x: 88,  y: -171 },
  "rockford hills":         { x: 101, y: -179 },
  "place des cubes":        { x: 122, y: -192 },
  "pillbox hill":           { x: 120, y: -187 },
  "little seoul":           { x: 105, y: -192 },
  "la mesa":                { x: 133, y: -194 },
  "el burro heights":       { x: 145, y: -207 },
  "cypress flats":          { x: 136, y: -224 },
  "pont rouge":             { x: 133, y: -227 },
  "pont vert":              { x: 108, y: -220 },
  "terminal":               { x: 137, y: -239 },
  "port de los santos":     { x: 117, y: -225 },
  "del perro":              { x: 84,  y: -188 },
  "fete forraine":          { x: 84,  y: -194 },
  "vespucci":               { x: 96,  y: -185 },
  "vespucci beach":         { x: 88,  y: -204 },
  "marina":                 { x: 99,  y: -202 },
  "morningwood":            { x: 89,  y: -178 },
  "hawick":                 { x: 124, y: -178 },
  "davis":                  { x: 124, y: -205 },
  "strawberry":             { x: 117, y: -206 },
  "champs petrole":         { x: 148, y: -217 },
  "rancho":                 { x: 124, y: -215 },
  "mirror park":            { x: 140, y: -184 },
  "golf":                   { x: 92,  y: -171 },
  "cimetiere":              { x: 82,  y: -171 },
  "eclipse":                { x: 102, y: -168 },
  "spanish avenue":         { x: 115, y: -171 },

  // --- Blaine County ---
  "harmony":                { x: 125, y: -114 },
  "sandy shores":           { x: 153, y: -96  },
  "grapeseed":              { x: 161, y: -71  },
  "paleto":                 { x: 114, y: -42  },
  "mont chiliad":           { x: 128, y: -59  },
  "aérodrome sandy shores": { x: 145, y: -109 },
  "fort zancudo":           { x: 74,  y: -108 },
  "marécages":              { x: 76,  y: -120 },
  "chumash":                { x: 52,  y: -153 },
  "banham canyon":          { x: 69,  y: -149 },
  "tongva hills":           { x: 69,  y: -132 },
  "mont josiah":            { x: 96,  y: -98  },
  "stab city":              { x: 119, y: -97  },
  "lac de sandy shores":    { x: 141, y: -89  },
  "mount gordo":            { x: 175, y: -49  },
  "mine":                   { x: 176, y: -114 },
  "palmer station":         { x: 175, y: -141 },
  "plage alcatraz":         { x: 175, y: -187 },

  // --- Autres ---
  "aéroport":               { x: 115, y: -171 }
};

/* ========================================================= */

const map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: MIN_ZOOM,
  maxZoom: MAX_ZOOM,
  zoomControl: false,
  attributionControl: false
});

L.control.zoom({ position: 'bottomright' }).addTo(map);

let currentLayer = null;
const layerCache = {};

function loadStyle(styleKey){
  if (currentLayer) map.removeLayer(currentLayer);

  if (!layerCache[styleKey]){
    layerCache[styleKey] = L.tileLayer(STYLES[styleKey], {
      tileSize: TILE_SIZE,
      minZoom: MIN_ZOOM,
      maxZoom: MAX_ZOOM,
      noWrap: true,
      errorTileUrl: '' // évite les icônes d'image cassée
    });
  }
  currentLayer = layerCache[styleKey];
  currentLayer.addTo(map);

  document.getElementById('map').style.background = STYLE_BG[styleKey];

  document.querySelectorAll('#stylePanel button').forEach(b=>{
    b.classList.toggle('active', b.dataset.style === styleKey);
  });

  checkTilesLoaded(styleKey);
}

function checkTilesLoaded(styleKey){
  const notice = document.getElementById('tileNotice');
  const testUrl = STYLES[styleKey].replace('{z}',0).replace('{x}',0).replace('{y}',0);
  fetch(testUrl, { method:'HEAD' })
    .then(r => { notice.style.display = r.ok ? 'none' : 'block'; })
    .catch(() => { notice.style.display = 'block'; });
}

document.querySelectorAll('#stylePanel button').forEach(btn=>{
  btn.addEventListener('click', () => loadStyle(btn.dataset.style));
});

loadStyle('atlas');

// Calcule l'étendue totale de la carte à partir de la grille de tuiles,
// puis cale la vue dessus pour qu'elle remplisse l'écran au chargement
// (au lieu de rester minuscule dans un coin au zoom 0).
const mapPixelSize = TILE_SIZE * TILES_AT_MAX_ZOOM;
const southWest = map.unproject([0, mapPixelSize], MAX_ZOOM);
const northEast = map.unproject([mapPixelSize, 0], MAX_ZOOM);
const fullBounds = L.latLngBounds(southWest, northEast);

map.setMaxBounds(fullBounds);
map.fitBounds(fullBounds);

/* ---------- Blips ---------- */
let blips = JSON.parse(localStorage.getItem('gta_blips') || '[]');
const blipList = document.getElementById('blipList');
const blipMarkers = [];

function saveBlips(){
  localStorage.setItem('gta_blips', JSON.stringify(blips));
}

function renderBlipList(){
  blipList.innerHTML = '';
  blips.forEach((b, i) => {
    const row = document.createElement('div');
    row.className = 'blip-item';
    row.innerHTML = `<span>${b.name}</span><span class="del" data-i="${i}">✕</span>`;
    row.addEventListener('click', (e) => {
      if (e.target.classList.contains('del')) return;
      map.setView([b.lat, b.lng], Math.max(map.getZoom(), SEARCH_ZOOM));
    });
    row.querySelector('.del').addEventListener('click', () => {
      blips.splice(i, 1);
      saveBlips();
      redrawBlips();
    });
    blipList.appendChild(row);
  });
}

function redrawBlips(){
  blipMarkers.forEach(m => map.removeLayer(m));
  blipMarkers.length = 0;
  blips.forEach(b => {
    const marker = L.marker([b.lat, b.lng]).addTo(map)
      .bindPopup(`<b>${b.name}</b><br><span style="color:#8b93a1">${Math.round(b.lng)}, ${Math.round(b.lat)}</span>`);
    blipMarkers.push(marker);
  });
  renderBlipList();
}

map.on('click', (e) => {
  const name = prompt('Nom du blip :');
  if (!name) return;
  blips.push({ name, lat: e.latlng.lat, lng: e.latlng.lng });
  saveBlips();
  redrawBlips();
});

document.getElementById('blipPanel').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (confirm('Supprimer tous les blips ?')){
    blips = [];
    saveBlips();
    redrawBlips();
  }
});

redrawBlips();

/* ---------- Coordonnées live ---------- */
map.on('mousemove', (e) => {
  document.getElementById('cx').textContent = Math.round(e.latlng.lng);
  document.getElementById('cy').textContent = Math.round(e.latlng.lat);
});

/* ---------- Recherche ---------- */
function doSearch(silent){
  const raw = document.getElementById('searchInput').value.trim();
  if (!raw) return;

  // Format "x,y"
  const coordMatch = raw.match(/^(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)$/);
  if (coordMatch){
    const x = parseFloat(coordMatch[1]);
    const y = parseFloat(coordMatch[3]);
    map.setView([y, x], SEARCH_ZOOM);
    return;
  }

  // Lieu nommé — recherche sur DÉBUT DE MOT (pas juste "contient"), pour éviter
  // les faux positifs du style "lac" qui matchait "pLACe des cubes".
  // Ex: "pal" trouve "paleto", "vinew" trouve "vinewood", "cube" trouve "place des cubes".
  const key = raw.toLowerCase();
  const escapedKey = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const wordBoundaryRegex = new RegExp('(^|\\s)' + escapedKey);
  const matchKey = Object.keys(PLACES).find(name =>
    wordBoundaryRegex.test(name) && PLACES[name].x !== null && PLACES[name].y !== null
  );
  if (matchKey){
    const p = PLACES[matchKey];
    map.setView([p.y, p.x], SEARCH_ZOOM);
    return;
  }

  // En mode "live" (pendant la frappe), on ne râle pas si rien ne correspond
  // encore — l'utilisateur n'a peut-être juste pas fini de taper.
  if (!silent){
    alert("Lieu introuvable. Essaie des coordonnées au format \"x,y\" ou un nom de lieu GTA V.");
  }
}

document.getElementById('searchBtn').addEventListener('click', () => doSearch(false));
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doSearch(false);
});

// Recherche en direct : zoome dès qu'un lieu correspond, sans attendre Entrée
document.getElementById('searchInput').addEventListener('input', () => {
  doSearch(true);
});
</script>
</body>
</html>
