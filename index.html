<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #12183c;
  --ink: #f5f6fa;
  --ink-dim: rgba(245, 246, 250, 0.62);
  --metal-1: #ffffff;
  --metal-2: #d7dbe6;
  --metal-3: #9aa1b5;
  --metal-4: #6b7286;
  --field-bg: rgba(6, 9, 26, 0.38);
  --field-border: rgba(255, 255, 255, 0.16);
  --danger: #ff9090;

  --font-display: "Manrope", "Segoe UI", sans-serif;
  --font-body: "Inter", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);

  background-image:
    radial-gradient(ellipse at center, rgba(10, 13, 34, 0) 40%, rgba(6, 8, 24, 0.55) 100%),
    url("background.png");
  background-color: var(--bg-deep);
  background-repeat: no-repeat;
  background-position: center center;
  background-size: cover;
  background-attachment: fixed;

  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}

.scene {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 28px;
}

.panel {
  width: 100%;
  max-width: 360px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.mark {
  width: 128px;
  height: auto;
  margin-bottom: 22px;
  filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.45));
}

.eyebrow {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--metal-2);
}

.title {
  margin: 0 0 34px;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  line-height: 1.35;
  color: var(--ink);
  max-width: 300px;
}

.form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
}

.field__label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--ink-dim);
  text-transform: uppercase;
  padding-left: 4px;
}

.field input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14.5px;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.field input::placeholder {
  color: rgba(245, 246, 250, 0.3);
}

.field input:focus {
  border-color: var(--metal-2);
  box-shadow: 0 0 0 3px rgba(215, 219, 230, 0.16);
}

.field__password {
  position: relative;
  display: flex;
  align-items: center;
}

.field__password input {
  padding-right: 44px;
}

.password-toggle {
  position: absolute;
  right: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: var(--ink-dim);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  transition: color 0.15s ease;
}

.password-toggle:hover { color: var(--ink); }

.error {
  margin: -2px 0 0;
  font-size: 13px;
  color: var(--danger);
  line-height: 1.4;
  text-align: left;
  padding-left: 4px;
}

.submit {
  margin-top: 10px;
  padding: 15px 20px;
  border: none;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--metal-1) 0%, var(--metal-2) 45%, var(--metal-3) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    inset 0 -6px 10px rgba(90, 97, 117, 0.35),
    0 10px 24px -8px rgba(0, 0, 0, 0.55);
  color: #1c2138;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14.5px;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: filter 0.15s ease, transform 0.1s ease;
}

.submit:hover { filter: brightness(1.04); }
.submit:active { transform: translateY(1px); }
.submit:disabled { opacity: 0.65; cursor: progress; }

@media (max-width: 420px) {
  .title { font-size: 19px; }
  .mark { width: 104px; }
}
</style>
</head>
<body>

  <div class="scene">
    <main class="panel" role="main">

      <img class="mark" src="logo.png" alt="Logo" />

      <p class="eyebrow">Accès restreint</p>
      <h1 class="title">Connexion</h1>

      <form id="login-form" class="form" autocomplete="off" novalidate>
        <label class="field">
          <span class="field__label">Identifiant</span>
          <input
            type="text"
            id="identifiant"
            name="identifiant"
            placeholder="identifiant"
            autocomplete="username"
            required
          >
        </label>

        <label class="field">
          <span class="field__label">Mot de passe</span>
          <div class="field__password">
            <input
              type="password"
              id="mot-de-passe"
              name="mot-de-passe"
              placeholder="mot de passe"
              autocomplete="current-password"
              required
            >
            <button type="button" id="toggle-password" class="password-toggle" aria-label="Afficher le mot de passe">
              <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.7 19.7 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a19.8 19.8 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </label>

        <p id="error-message" class="error" hidden></p>

        <button type="submit" id="submit-btn" class="submit">
          <span class="submit__label">Se connecter</span>
        </button>
      </form>
    </main>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
