<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #12183c;
  --ink: #f5f6fa;
  --ink-dim: rgba(245, 246, 250, 0.62);
  --metal-1: #ffffff;
  --metal-2: #d7dbe6;
  --metal-3: #9aa1b5;
  --glass-bg: rgba(255, 255, 255, 0.07);
  --glass-bg-strong: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.16);
  --font-display: "Manrope", "Segoe UI", sans-serif;
  --font-body: "Inter", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);

  background-image:
    radial-gradient(ellipse at center, rgba(10, 13, 34, 0) 40%, rgba(6, 8, 24, 0.55) 100%),
    url("background.png");
  background-color: var(--bg-deep);
  background-repeat: no-repeat;
  background-position: center center;
  background-size: cover;
  background-attachment: fixed;

  min-height: 100vh;
}

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 26px 32px 32px;
}

/* ---- Barre du haut ---- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand img {
  width: 34px;
  height: auto;
}

.brand span {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.01em;
  color: var(--ink);
}

.topbar__right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.clock {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  color: var(--ink);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 9px 16px;
  border-radius: 999px;
  min-width: 78px;
  text-align: center;
}

.logout-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 18px;
  border: none;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--metal-1) 0%, var(--metal-2) 45%, var(--metal-3) 100%);
  color: #1c2138;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13.5px;
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    0 8px 18px -8px rgba(0, 0, 0, 0.55);
  transition: filter 0.15s ease, transform 0.1s ease;
}

.logout-btn:hover { filter: brightness(1.05); }
.logout-btn:active { transform: translateY(1px); }

/* ---- Layout 3 colonnes : 1.5 / 2 / 1.5 ---- */
.board {
  flex: 1;
  display: grid;
  grid-template-columns: 1.5fr 2fr 1.5fr;
  gap: 20px;
  align-items: start;
}

.panel {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 20px 40px -24px rgba(0, 0, 0, 0.6);
  display: flex;
  flex-direction: column;
  min-height: 420px;
}

.panel__title {
  margin: 0 0 18px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 15px;
  color: var(--ink);
}

.panel__hint {
  margin: -12px 0 16px;
  font-size: 12px;
  color: var(--ink-dim);
}

/* ---- Classement ---- */
.rank-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.rank-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
}

.rank-item__pos {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: linear-gradient(180deg, var(--metal-1), var(--metal-3));
  color: #1c2138;
  font-weight: 800;
  font-size: 11.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.rank-item__name {
  flex: 1;
  font-size: 13.5px;
  font-weight: 600;
}

.rank-item__score {
  font-size: 12.5px;
  color: var(--ink-dim);
}

/* ---- Timeline ---- */
.timeline {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.timeline-item {
  position: relative;
  padding: 0 0 20px 22px;
  border-left: 1.5px solid var(--glass-border);
}

.timeline-item:last-child {
  border-left-color: transparent;
  padding-bottom: 0;
}

.timeline-item::before {
  content: "";
  position: absolute;
  left: -5.5px;
  top: 2px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--metal-2);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
}

.timeline-item__time {
  font-size: 11.5px;
  color: var(--ink-dim);
  margin-bottom: 3px;
}

.timeline-item__text {
  font-size: 13.5px;
  font-weight: 500;
}

/* ---- Derniers comptes créés ---- */
.account-list {
  list-style: none;
  margin: 0 0 16px;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.account-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
}

.account-item__name {
  font-size: 13.5px;
  font-weight: 600;
}

.account-item__date {
  font-size: 11.5px;
  color: var(--ink-dim);
}

.see-more-btn {
  align-self: center;
  padding: 11px 28px;
  border: none;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--metal-1) 0%, var(--metal-2) 45%, var(--metal-3) 100%);
  color: #1c2138;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 13.5px;
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    0 10px 22px -10px rgba(0, 0, 0, 0.55);
  transition: filter 0.15s ease, transform 0.1s ease;
}

.see-more-btn:hover { filter: brightness(1.05); }
.see-more-btn:active { transform: translateY(1px); }

/* ---- Bouton "Nouveau défi" ---- */
.new-defi-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 18px;
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  background: var(--glass-bg);
  color: var(--ink);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13.5px;
  cursor: pointer;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition: filter 0.15s ease, transform 0.1s ease, background 0.15s ease;
}

.new-defi-btn:hover { background: var(--glass-bg-strong); }
.new-defi-btn:active { transform: translateY(1px); }

/* ---- Modale "Nouveau défi" ---- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(6, 9, 26, 0.55);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.18s ease, visibility 0.18s ease;
  z-index: 40;
}

.modal-backdrop.open { opacity: 1; visibility: visible; }

.modal-panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(480px, 92vw);
  max-height: 86vh;
  overflow-y: auto;
  padding: 26px;
  border-radius: 20px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.18s ease, visibility 0.18s ease;
  z-index: 41;
}

.modal-panel.open { opacity: 1; visibility: visible; pointer-events: auto; }

.modal-panel__title {
  margin: 0 0 18px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 17px;
}

#defi-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field__label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--ink-dim);
  text-transform: uppercase;
}

.field input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--glass-border);
  background: rgba(6, 9, 26, 0.38);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
}

.field input:focus { border-color: var(--metal-2); }

.field-row { display: flex; gap: 12px; }
.field-row .field { flex: 1; }

.visiteurs-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  max-height: 200px;
  overflow-y: auto;
  padding-right: 4px;
}

.visiteur-check {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border-radius: 10px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  font-size: 13px;
  cursor: pointer;
}

.visiteur-check input { margin: 0; accent-color: var(--metal-2); }

.modal-submit-btn {
  padding: 13px 16px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(180deg, var(--metal-1) 0%, var(--metal-2) 45%, var(--metal-3) 100%);
  color: #1c2138;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
}

.modal-submit-btn:disabled { opacity: 0.6; cursor: progress; }

.modal-message { font-size: 13px; margin: 0; }
.modal-message--error { color: #ff9090; }
.modal-message--success { color: #8be6a8; }

@media (max-width: 900px) {
  .board {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

  <div class="page">

    <div class="topbar">
      <div class="brand">
        <img src="logo admin.png" alt="Logo">
        <span>Espace admin</span>
      </div>
      <div class="topbar__right">
        <div id="clock" class="clock">--:--</div>
        <button id="new-defi-btn" class="new-defi-btn" type="button">+ Nouveau défi</button>
        <button id="logout-btn" class="logout-btn" type="button">Déconnexion</button>
      </div>
    </div>

    <div class="board">

      <!-- 1. Classement (1.5/5) -->
      <section class="panel">
        <h2 class="panel__title">Classement</h2>
        <p class="panel__hint">Comptes ayant fait le plus d'actions</p>
        <ul class="rank-list" id="rank-list">
          <!-- Rempli dynamiquement par admin.js -->
        </ul>
      </section>

      <!-- 2. Timeline (2/5) -->
      <section class="panel">
        <h2 class="panel__title">Timeline des actions</h2>
        <p class="panel__hint">Activité récente sur le site</p>
        <ul class="timeline" id="timeline-list">
          <!-- Rempli dynamiquement par admin.js -->
        </ul>
      </section>

      <!-- 3. Derniers comptes créés (1.5/5) -->
      <section class="panel">
        <h2 class="panel__title">Derniers comptes créés</h2>
        <ul class="account-list" id="account-list">
          <!-- Rempli dynamiquement par admin.js -->
        </ul>
        <button class="see-more-btn" id="see-more-btn" type="button">voir</button>
      </section>

    </div>

  </div>

  <!-- Modale "Nouveau défi" -->
  <div class="modal-backdrop" id="defi-modal-backdrop"></div>

  <div class="modal-panel" id="defi-modal">
    <h2 class="modal-panel__title">Nouveau défi</h2>

    <form id="defi-form">
      <div class="field">
        <span class="field__label">Titre</span>
        <input type="text" id="defi-titre-input" placeholder="Titre du défi" required>
      </div>

      <div class="field-row">
        <label class="field">
          <span class="field__label">Montant ($)</span>
          <input type="number" id="defi-montant-input" min="0" step="1" placeholder="0" required>
        </label>
        <label class="field">
          <span class="field__label">Heures</span>
          <input type="number" id="defi-heures-input" min="0" step="1" value="0">
        </label>
        <label class="field">
          <span class="field__label">Minutes</span>
          <input type="number" id="defi-minutes-input" min="0" max="59" step="1" value="0">
        </label>
      </div>

      <div class="field">
        <span class="field__label">Visiteurs concernés</span>
        <div class="visiteurs-grid" id="visiteurs-grid">
          <!-- Rempli dynamiquement par admin.js -->
        </div>
      </div>

      <p id="defi-form-message" class="modal-message" hidden></p>

      <button type="submit" class="modal-submit-btn" id="defi-submit-btn">Créer le défi</button>
    </form>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
