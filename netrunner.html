<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>0x1B :: NETRUNNER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04060a;
    --bg-panel:#080d15;
    --bg-raised:#0c131e;
    --line:rgba(77,243,255,0.16);
    --line-strong:rgba(77,243,255,0.35);
    --cyan:#4df3ff;
    --cyan-dim:#1f7c87;
    --magenta:#ff3fd8;
    --amber:#ffcf5c;
    --green:#59ffb0;
    --red:#ff4d6d;
    --text:#cdeef2;
    --text-dim:#5c8794;
    --mono: 'JetBrains Mono', monospace;
    --disp: 'Share Tech Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(77,243,255,0.08), transparent 45%),
      radial-gradient(ellipse at 100% 10%, rgba(255,63,216,0.07), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--mono);
    overflow:hidden;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(0px, 3vh, 34px) clamp(0px, 3vw, 34px);
  }
  ::selection{ background:var(--magenta); color:#000; }
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--cyan-dim); border-radius:4px;}

  /* ---------- boot overlay ---------- */
  #boot{
    position:fixed; inset:0; z-index:100;
    background:#000;
    color:var(--cyan);
    font-family:var(--mono);
    font-size:13px;
    padding:24px;
    display:flex; flex-direction:column;
    white-space:pre-wrap;
  }
  #boot .line{opacity:0; animation:fadein .05s forwards;}
  @keyframes fadein{to{opacity:1;}}
  #boot-skip{
    position:absolute; bottom:18px; right:18px;
    background:none; border:1px solid var(--line-strong); color:var(--text-dim);
    font-family:var(--disp); font-size:11px; letter-spacing:.15em;
    padding:8px 14px; cursor:pointer; text-transform:uppercase;
  }
  #boot-skip:hover{color:var(--cyan); border-color:var(--cyan);}

  .scanlines{
    pointer-events:none; position:absolute; inset:0; z-index:90;
    background:repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.022) 0px, rgba(255,255,255,0.022) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }
  .vignette{
    pointer-events:none; position:absolute; inset:0; z-index:91;
    box-shadow: inset 0 0 160px rgba(0,0,0,0.85);
  }

  /* ---------- app shell (fenêtre "terminal" centrée sur desktop) ---------- */
  #app{
    display:none;
    position:relative;
    width:100%;
    max-width:1360px;
    height:100%;
    max-height:860px;
    grid-template-rows:auto 1fr auto;
    display:grid;
    border:1px solid var(--line-strong);
    border-radius:10px;
    overflow:hidden;
    background:var(--bg);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.5),
      0 40px 90px rgba(0,0,0,0.65),
      0 0 70px rgba(77,243,255,0.06);
  }
  #app::before, #app::after{
    content:''; position:absolute; width:16px; height:16px; z-index:95; pointer-events:none;
    border-color:var(--cyan-dim); opacity:.7;
  }
  #app::before{ top:8px; left:8px; border-top:1px solid; border-left:1px solid; }
  #app::after{ bottom:8px; right:8px; border-bottom:1px solid; border-right:1px solid; }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(77,243,255,0.05), transparent);
    gap:10px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:var(--disp);
    letter-spacing:.12em;
  }
  .brand .glyph{
    width:26px;height:26px; border:1px solid var(--cyan); display:flex; align-items:center; justify-content:center;
    color:var(--cyan); font-size:13px; box-shadow:0 0 12px rgba(77,243,255,.5); flex:none;
  }
  .brand b{color:var(--cyan); text-shadow:0 0 8px rgba(77,243,255,.6); font-size:14px;}
  .brand span{color:var(--text-dim); font-size:10px; display:block;}
  .hud{ display:flex; gap:14px; align-items:center; font-family:var(--disp); font-size:11px; color:var(--text-dim);}
  .hud .stat b{color:var(--cyan); display:block; font-size:13px;}
  .hud .stat{ text-align:right; letter-spacing:.08em; }
  .hud .trace b{color:var(--amber);}
  .hud .trace.danger b{color:var(--red); animation:blink 0.6s infinite;}
  @keyframes blink{50%{opacity:.35;}}
  #clock{font-family:var(--disp); color:var(--text-dim); font-size:11px; letter-spacing:.1em;}

  #menu-toggle{
    display:none;
    background:none; border:1px solid var(--line-strong); color:var(--cyan);
    font-family:var(--disp); font-size:11px; padding:8px 10px; cursor:pointer; letter-spacing:.1em;
  }

  main{
    display:grid;
    grid-template-columns:1fr 340px;
    min-height:0;
  }
  #terminal-wrap{
    display:flex; flex-direction:column; min-height:0;
    border-right:1px solid var(--line);
    position:relative;
  }
  #log{
    flex:1; overflow-y:auto; padding:14px 16px; font-size:12.5px; line-height:1.6;
  }
  #log .row{margin-bottom:2px; white-space:pre-wrap; word-break:break-word;}
  #log .prompt-echo{color:var(--text-dim);}
  #log .prompt-echo b{color:var(--magenta);}
  #log .ok{color:var(--green);}
  #log .warn{color:var(--amber);}
  #log .err{color:var(--red);}
  #log .sys{color:var(--cyan);}
  #log .dim{color:var(--text-dim);}
  #log .title{color:var(--cyan); text-shadow:0 0 6px rgba(77,243,255,.5);}
  #log table{border-collapse:collapse; margin:4px 0;}
  #log td{padding:1px 14px 1px 0; vertical-align:top;}

  .inputline{
    display:flex; align-items:center; gap:8px;
    border-top:1px solid var(--line);
    padding:10px 16px;
    background:rgba(77,243,255,0.02);
  }
  .inputline .chevron{color:var(--magenta); font-size:13px;}
  .inputline .path{color:var(--cyan-dim); font-size:12px; white-space:nowrap;}
  #cmd{
    flex:1; background:none; border:none; outline:none;
    color:var(--text); font-family:var(--mono); font-size:13px; caret-color:var(--cyan);
  }
  #cmd::placeholder{color:#2c4650;}

  /* ---------- side panel ---------- */
  #side{ display:flex; flex-direction:column; min-height:0; background:var(--bg-panel);}
  .panel{ border-bottom:1px solid var(--line); padding:12px 14px; }
  .panel h3{
    margin:0 0 10px; font-family:var(--disp); font-size:11px; letter-spacing:.16em;
    color:var(--text-dim); text-transform:uppercase; display:flex; align-items:center; gap:8px;
  }
  .panel h3::before{content:''; width:6px; height:6px; background:var(--cyan); box-shadow:0 0 6px var(--cyan);}

  #netmap{ flex:1; min-height:180px; overflow:auto; }
  #netmap svg{ width:100%; display:block; }
  .node-label{ font-family:var(--disp); font-size:9px; fill:var(--text-dim); }
  .node-ip{ font-family:var(--mono); font-size:8px; fill:var(--text-dim); }

  #objectives{font-size:11.5px; line-height:1.7; color:var(--text-dim);}
  #objectives .obj{display:flex; gap:8px; margin-bottom:6px; align-items:flex-start;}
  #objectives .mark{color:var(--cyan-dim); flex:none;}
  #objectives .done .mark{color:var(--green);}
  #objectives .done span.txt{color:var(--text-dim); text-decoration:line-through;}
  #objectives .active span.txt{color:var(--text);}

  #tools{font-size:11.5px; color:var(--text-dim);}
  #tools .tool{display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed rgba(77,243,255,0.08);}
  #tools .tool b{color:var(--cyan); font-weight:500;}

  footer{
    border-top:1px solid var(--line);
    padding:6px 16px;
    display:flex; gap:16px; flex-wrap:wrap;
    font-size:10px; color:var(--text-dim); font-family:var(--disp); letter-spacing:.06em;
  }
  footer b{color:var(--cyan-dim);}

  /* ---------- mobile: fenêtre en plein écran, sans bezel ---------- */
  @media (max-width: 860px){
    body{ padding:0; }
    #app{
      max-width:none; max-height:none; height:100vh; width:100vw;
      border:none; border-radius:0; box-shadow:none;
    }
    #app::before, #app::after{ display:none; }
    #menu-toggle{display:inline-block;}
    main{ grid-template-columns:1fr; }
    #terminal-wrap{ border-right:none; }
    #side{
      position:fixed; top:0; right:0; bottom:0; width:82vw; max-width:340px;
      transform:translateX(100%); transition:transform .25s ease; z-index:60;
      box-shadow:-20px 0 40px rgba(0,0,0,0.6);
      border-left:1px solid var(--line-strong);
    }
    #side.open{ transform:translateX(0); }
    #side-backdrop{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:55;
    }
    #side-backdrop.open{ display:block; }
    .hud .stat.hide-mobile{display:none;}
    header{padding:10px 12px;}
    #log{font-size:12px; padding:10px 12px;}
    .inputline{padding:8px 10px;}
  }
</style>
</head>
<body>

<div id="boot">
  <div id="boot-lines"></div>
  <button id="boot-skip">PASSER ▶</button>
</div>

<div id="app">
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <header>
    <div class="brand">
      <div class="glyph">0x</div>
      <div>
        <b>NETRUNNER_OS</b>
        <span>collectif 0x1B — session chiffrée</span>
      </div>
    </div>
    <div class="hud">
      <div class="stat hide-mobile"><b id="hud-clock">--:--:--</b>HEURE LOCALE</div>
      <div class="stat"><b id="hud-credits">0 ¥</b>CRÉDITS</div>
      <div class="stat trace" id="hud-trace-wrap"><b id="hud-trace">0%</b>TRAÇAGE</div>
      <button id="menu-toggle">☰ RÉSEAU</button>
    </div>
  </header>

  <main>
    <div id="terminal-wrap">
      <div id="log"></div>
      <div class="inputline">
        <span class="chevron">❯</span>
        <span class="path" id="prompt-path">guest@disconnected:~$</span>
        <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="tape 'help' pour commencer…">
      </div>
    </div>

    <div id="side-backdrop"></div>
    <div id="side">
      <div class="panel" id="netmap-panel">
        <h3>Carte réseau</h3>
        <div id="netmap"></div>
      </div>
      <div class="panel">
        <h3>Objectifs</h3>
        <div id="objectives"></div>
      </div>
      <div class="panel" style="border-bottom:none;">
        <h3>Programmes</h3>
        <div id="tools"></div>
      </div>
    </div>
  </main>

  <footer>
    <span><b>help</b> commandes</span>
    <span><b>scan</b> découvrir</span>
    <span><b>connect &lt;ip&gt;</b> lier</span>
    <span><b>analyze</b> ports</span>
    <span><b>crack &lt;outil&gt;</b> percer</span>
    <span><b>porthack</b> root</span>
    <span><b>ls / cat / download</b> fichiers</span>
    <span><b>disconnect</b> couper</span>
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ============ DATA: monde du jeu ============ */

  const world = {
    credits: 400,
    trace: 0,
    traceActive: false,
    traceTimer: null,
    connected: null, // ip
    rooted: {},      // ip -> bool
    cracked: {},      // ip -> Set of tools cracked on this node
    downloaded: new Set(),
    owned_tools: new Set(["SSHcrack v1", "PortHack v1"]),
    stage: 0, // mission progress
  };

  const nodes = {
    "94.22.10.4": {
      name: "omnicorp-mail.relay",
      label: "MAIL RELAY",
      security: 1,
      required: ["SSHcrack v1"],
      ports: ["SSH:22"],
      x: 60, y: 60,
      files: {
        "memo_interne.txt": "MEMO — RH à Direction\nRéf. dossier 'PROJET CENDRE' transféré au serveur RH.\nAccès restreint : ftpbounce requis pour la passerelle RH.\nIP RH : 94.22.10.9",
        "readme.txt": "Serveur relais de messagerie OmniCorp.\nNe contient aucune donnée sensible directe."
      },
      loot: {file:"ftpbounce.exe", tool:"FTPBounce v1"},
      next_unlocked_by: null
    },
    "94.22.10.9": {
      name: "omnicorp-hr.db",
      label: "BASE RH",
      security: 2,
      required: ["SSHcrack v1", "FTPBounce v1"],
      ports: ["SSH:22", "FTP:21"],
      x: 220, y: 140,
      files: {
        "projet_cendre_extrait.txt": "PROJET CENDRE — extrait\nLicenciements maquillés en 'restructuration verte'.\nCoffre-fort central : décrypteur requis.\nIP Coffre : 94.22.10.13",
        "paie_2026.csv": "id,poste,salaire\n[fichier volumineux tronqué]"
      },
      loot: {file:"decrypter.exe", tool:"Decrypter v1"},
      next_unlocked_by: null
    },
    "94.22.10.13": {
      name: "omnicorp-core.vault",
      label: "COFFRE CENTRAL",
      security: 4,
      required: ["SSHcrack v1", "FTPBounce v1", "Decrypter v1"],
      ports: ["SSH:22", "FTP:21", "VAULT:8888"],
      x: 260, y: 260,
      files: {
        "PROJET_CENDRE_COMPLET.enc": "[CHIFFRÉ] — preuve complète de fraude comptable et de licenciements illégaux.\nPrête à être exfiltrée vers le collectif.",
      },
      loot: {file:"PROJET_CENDRE_COMPLET.enc", tool:null},
      traceOnConnect: true
    }
  };

  const objectives = [
    {id:0, text:"Scanner le réseau OmniCorp (commande: scan)", done:()=> scanned},
    {id:1, text:"Infiltrer le relais mail (94.22.10.4)", done:()=> world.rooted["94.22.10.4"]},
    {id:2, text:"Récupérer ftpbounce.exe et atteindre la base RH", done:()=> world.rooted["94.22.10.9"]},
    {id:3, text:"Obtenir le décrypteur et localiser le coffre central", done:()=> world.downloaded.has("decrypter.exe")},
    {id:4, text:"Percer le coffre central avant la fin du traçage", done:()=> world.rooted["94.22.10.13"]},
    {id:5, text:"Exfiltrer PROJET_CENDRE_COMPLET.enc vers le collectif", done:()=> world.downloaded.has("PROJET_CENDRE_COMPLET.enc")},
  ];

  let scanned = false;
  let discovered = new Set();

  /* ============ BOOT SEQUENCE ============ */

  const bootLines = [
    "NETRUNNER_OS v2.7.7 — chargement du noyau…",
    "vérification de l'intégrité mémoire ......... OK",
    "initialisation pile réseau ................. OK",
    "chargement pare-feu furtif .................. OK",
    "montage volume chiffré /home/ghost ......... OK",
    "établissement liaison proxy (7 relais) ...... OK",
    "",
    "  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  0x1B  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓",
    "  COLLECTIF 0x1B — RÉSEAU CLANDESTIN",
    "  identité : GHOST_07 authentifiée",
    "  mission active : PROJET CENDRE (voir 'missions')",
    "  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓",
    "",
    "connexion établie. tape 'help' pour la liste des commandes.",
  ];

  const bootEl = document.getElementById("boot-lines");
  let bootDone = false;
  function runBoot(){
    let i = 0;
    function next(){
      if (i >= bootLines.length || bootDone) { finishBoot(); return; }
      const d = document.createElement("div");
      d.className = "line";
      d.textContent = bootLines[i];
      bootEl.appendChild(d);
      i++;
      setTimeout(next, bootLines[i-1] === "" ? 60 : 90 + Math.random()*70);
    }
    next();
  }
  function finishBoot(){
    if (bootDone) return;
    bootDone = true;
    const boot = document.getElementById("boot");
    boot.style.transition = "opacity .4s ease";
    boot.style.opacity = "0";
    setTimeout(()=>{ boot.style.display="none"; document.getElementById("app").style.display="grid"; initApp(); }, 400);
  }
  document.getElementById("boot-skip").addEventListener("click", finishBoot);
  runBoot();

  /* ============ TERMINAL CORE ============ */

  const logEl = document.getElementById("log");
  const cmdEl = document.getElementById("cmd");
  const pathEl = document.getElementById("prompt-path");

  function print(text, cls){
    const row = document.createElement("div");
    row.className = "row" + (cls ? " " + cls : "");
    row.textContent = text;
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function printHTML(html, cls){
    const row = document.createElement("div");
    row.className = "row" + (cls ? " " + cls : "");
    row.innerHTML = html;
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function updatePrompt(){
    if (world.connected){
      const n = nodes[world.connected];
      pathEl.textContent = (world.rooted[world.connected] ? "root" : "guest") + "@" + n.name + ":~$";
    } else {
      pathEl.textContent = "ghost@localhost:~$";
    }
  }

  const history = [];
  let histIdx = -1;

  cmdEl.addEventListener("keydown", (e)=>{
    if (e.key === "Enter"){
      const val = cmdEl.value;
      if (val.trim() !== ""){ history.push(val); }
      histIdx = history.length;
      handleCommand(val);
      cmdEl.value = "";
    } else if (e.key === "ArrowUp"){
      if (histIdx > 0){ histIdx--; cmdEl.value = history[histIdx]; setTimeout(()=>cmdEl.setSelectionRange(999,999)); }
      e.preventDefault();
    } else if (e.key === "ArrowDown"){
      if (histIdx < history.length-1){ histIdx++; cmdEl.value = history[histIdx]; }
      else { histIdx = history.length; cmdEl.value=""; }
      e.preventDefault();
    }
  });

  document.addEventListener("click", (e)=>{
    if (!e.target.closest("#side") && !e.target.closest("#menu-toggle")) cmdEl.focus();
  });

  /* ============ COMMAND HANDLING ============ */

  function handleCommand(raw){
    printHTML(`<span class="prompt-echo"><b>${escapeHTML(pathEl.textContent)}</b> ${escapeHTML(raw)}</span>`);
    const parts = raw.trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return;
    const cmd = parts[0].toLowerCase();
    const arg = parts.slice(1).join(" ");

    switch(cmd){
      case "help": cmdHelp(); break;
      case "scan": cmdScan(); break;
      case "analyze": case "analyse": cmdAnalyze(arg); break;
      case "connect": cmdConnect(arg); break;
      case "disconnect": cmdDisconnect(); break;
      case "crack": cmdCrack(arg); break;
      case "porthack": cmdPorthack(); break;
      case "ls": case "dir": cmdLs(); break;
      case "cat": case "read": cmdCat(arg); break;
      case "download": case "get": cmdDownload(arg); break;
      case "missions": case "objectives": cmdMissions(); break;
      case "tools": case "inventory": cmdTools(); break;
      case "whoami": cmdWhoami(); break;
      case "ifconfig": case "ip": cmdIfconfig(); break;
      case "clear": case "cls": logEl.innerHTML=""; break;
      default:
        print(`commande inconnue : '${cmd}'. tape 'help'.`, "err");
    }
    renderSide();
  }

  function escapeHTML(s){
    return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function cmdHelp(){
    print("COMMANDES DISPONIBLES", "title");
    const rows = [
      ["scan", "détecter les machines visibles sur le réseau courant"],
      ["analyze <ip>", "sonder les ports et le niveau de sécurité d'une cible"],
      ["connect <ip>", "établir une liaison vers une machine"],
      ["crack <outil>", "lancer un outil de crack contre la cible connectée"],
      ["porthack", "obtenir les droits root une fois assez de ports percés"],
      ["ls", "lister les fichiers de la machine connectée (root requis)"],
      ["cat <fichier>", "afficher le contenu d'un fichier"],
      ["download <fichier>", "exfiltrer un fichier vers ton stockage"],
      ["disconnect", "couper la liaison en cours"],
      ["missions", "afficher les objectifs de PROJET CENDRE"],
      ["tools", "lister tes programmes possédés"],
      ["whoami / ifconfig", "infos sur ton identité / ta liaison"],
      ["clear", "vider le terminal"],
    ];
    rows.forEach(r=>{
      printHTML(`<span class="ok">${r[0].padEnd(18,' ')}</span><span class="dim">${r[1]}</span>`);
    });
  }

  function cmdScan(){
    scanned = true;
    print("scan du segment réseau OmniCorp en cours…", "sys");
    Object.keys(nodes).forEach(ip=>{
      if (!discovered.has(ip) && (ip === "94.22.10.4" || (ip==="94.22.10.9" && discoveredHint("94.22.10.4")) || (ip==="94.22.10.13" && discoveredHint("94.22.10.9")))){
        discovered.add(ip);
      }
    });
    if (discovered.size === 0){ discovered.add("94.22.10.4"); }
    setTimeout(()=>{
      print(`${discovered.size} machine(s) détectée(s) :`, "ok");
      discovered.forEach(ip=>{
        const n = nodes[ip];
        printHTML(`  <span class="sys">${ip}</span>  <span class="dim">${n.name}  [sécurité niv.${n.security}]</span>`);
      });
      renderSide();
    }, 500);
  }
  function discoveredHint(ip){ return world.rooted[ip]; }

  function requireDiscovered(ip){
    if (!nodes[ip]) return false;
    return discovered.has(ip);
  }

  function cmdAnalyze(ip){
    if (!ip){ print("usage : analyze <ip>", "err"); return; }
    if (!requireDiscovered(ip)){ print("cible inconnue. lance 'scan' d'abord.", "err"); return; }
    const n = nodes[ip];
    print(`analyse de ${ip} (${n.name})…`, "sys");
    printHTML(`  ports ouverts : <span class="warn">${n.ports.join(", ")}</span>`);
    printHTML(`  sécurité : <span class="warn">niveau ${n.security}</span>`);
    printHTML(`  outils requis pour root : <span class="ok">${n.required.join(", ")}</span>`);
  }

  function cmdConnect(ip){
    if (!ip){ print("usage : connect <ip>", "err"); return; }
    if (!requireDiscovered(ip)){ print("cible inconnue. lance 'scan' d'abord.", "err"); return; }
    world.connected = ip;
    world.cracked[ip] = world.cracked[ip] || new Set();
    print(`liaison établie avec ${nodes[ip].name} [${ip}]`, "ok");
    if (!world.rooted[ip]) print("accès : invité (non-root). utilise 'crack' puis 'porthack'.", "dim");
    else print("accès : root déjà obtenu sur cette machine.", "ok");

    if (nodes[ip].traceOnConnect && !world.rooted[ip]){
      startTrace();
    }
    updatePrompt();
  }

  function cmdDisconnect(){
    if (!world.connected){ print("aucune liaison active.", "err"); return; }
    print(`liaison coupée avec ${nodes[world.connected].name}`, "warn");
    world.connected = null;
    stopTrace();
    updatePrompt();
  }

  function cmdCrack(tool){
    if (!world.connected){ print("aucune cible connectée.", "err"); return; }
    if (!tool){ print("usage : crack <outil>   (voir 'tools')", "err"); return; }
    const ip = world.connected;
    const n = nodes[ip];
    const normalized = normalizeTool(tool);
    if (!normalized){ print(`outil '${tool}' introuvable dans ton inventaire.`, "err"); return; }
    if (!world.owned_tools.has(normalized)){ print(`tu ne possèdes pas ${normalized}.`, "err"); return; }
    if (!n.required.includes(normalized)){ print(`${normalized} n'a aucun effet sur cette machine.`, "warn"); return; }
    if (world.cracked[ip].has(normalized)){ print(`${normalized} a déjà percé un port sur cette cible.`, "dim"); return; }

    print(`lancement de ${normalized}…`, "sys");
    const bar = progressBar();
    setTimeout(()=>{
      bar.finish();
      world.cracked[ip].add(normalized);
      print(`port percé grâce à ${normalized}. (${world.cracked[ip].size}/${n.required.length})`, "ok");
      if (world.cracked[ip].size >= n.required.length){
        print("tous les ports requis sont percés — 'porthack' est maintenant disponible.", "ok");
      }
      renderSide();
    }, 900);
  }

  function normalizeTool(t){
    const map = {
      "sshcrack":"SSHcrack v1", "ssh":"SSHcrack v1",
      "ftpbounce":"FTPBounce v1", "ftp":"FTPBounce v1",
      "decrypter":"Decrypter v1", "decrypt":"Decrypter v1",
      "porthack":"PortHack v1"
    };
    return map[t.toLowerCase()] || null;
  }

  function cmdPorthack(){
    if (!world.connected){ print("aucune cible connectée.", "err"); return; }
    const ip = world.connected;
    const n = nodes[ip];
    if (world.rooted[ip]){ print("root déjà obtenu sur cette machine.", "dim"); return; }
    if ((world.cracked[ip]?.size || 0) < n.required.length){
      print(`pas assez de ports percés (${world.cracked[ip]?.size||0}/${n.required.length}). utilise 'crack'.`, "err");
      return;
    }
    print("PortHack v1 — élévation de privilèges…", "sys");
    const bar = progressBar();
    setTimeout(()=>{
      bar.finish();
      world.rooted[ip] = true;
      print(`accès ROOT obtenu sur ${n.name}.`, "ok");
      updatePrompt();
      if (n.traceOnConnect){ stopTrace(); print("traçage interrompu — la cible est neutralisée à temps.", "ok"); }
      renderSide();
    }, 1100);
  }

  function cmdLs(){
    if (!world.connected){ print("aucune cible connectée.", "err"); return; }
    const ip = world.connected;
    if (!world.rooted[ip]){ print("accès refusé — droits root requis (utilise porthack).", "err"); return; }
    const files = nodes[ip].files;
    print(`fichiers sur ${nodes[ip].name} :`, "sys");
    Object.keys(files).forEach(f=>{
      printHTML(`  <span class="ok">${f}</span>${world.downloaded.has(f) ? '  <span class="dim">[téléchargé]</span>' : ''}`);
    });
  }

  function cmdCat(file){
    if (!world.connected){ print("aucune cible connectée.", "err"); return; }
    const ip = world.connected;
    if (!world.rooted[ip]){ print("accès refusé — droits root requis.", "err"); return; }
    if (!file){ print("usage : cat <fichier>", "err"); return; }
    const files = nodes[ip].files;
    if (!files[file]){ print(`fichier introuvable : ${file}`, "err"); return; }
    print(`── ${file} ──`, "title");
    files[file].split("\n").forEach(l=> print(l, "dim"));
  }

  function cmdDownload(file){
    if (!world.connected){ print("aucune cible connectée.", "err"); return; }
    const ip = world.connected;
    const n = nodes[ip];
    if (!world.rooted[ip]){ print("accès refusé — droits root requis.", "err"); return; }
    if (!file){ print("usage : download <fichier>", "err"); return; }
    if (!n.files[file]){ print(`fichier introuvable : ${file}`, "err"); return; }
    print(`téléchargement de ${file}…`, "sys");
    const bar = progressBar();
    setTimeout(()=>{
      bar.finish();
      world.downloaded.add(file);
      print(`${file} exfiltré avec succès.`, "ok");
      if (n.loot && n.loot.file === file && n.loot.tool){
        world.owned_tools.add(n.loot.tool);
        print(`nouveau programme installé : ${n.loot.tool}`, "ok");
      }
      if (ip === "94.22.10.13" && file === "PROJET_CENDRE_COMPLET.enc"){
        setTimeout(()=>{
          printHTML(`<span class="title">— MISSION ACCOMPLIE —</span>`);
          print("les preuves ont été transmises au collectif 0x1B.", "ok");
          print("OmniCorp ne pourra plus étouffer l'affaire PROJET CENDRE.", "ok");
          world.credits += 2500;
          renderSide();
        }, 400);
      } else {
        world.credits += 250;
      }
      renderSide();
    }, 1000);
  }

  function cmdMissions(){
    print("PROJET CENDRE — objectifs", "title");
    objectives.forEach(o=>{
      print((o.done() ? "[x] " : "[ ] ") + o.text, o.done() ? "ok" : "dim");
    });
  }

  function cmdTools(){
    print("programmes installés :", "sys");
    world.owned_tools.forEach(t=> print("  " + t, "ok"));
  }

  function cmdWhoami(){
    print("identité : GHOST_07", "sys");
    print("affiliation : collectif 0x1B", "dim");
    print("statut : non-traçable (proxy actif)", "dim");
  }

  function cmdIfconfig(){
    if (world.connected){
      printHTML(`liaison active → <span class="ok">${world.connected}</span> (${nodes[world.connected].name})`);
    } else {
      print("aucune liaison active. adresse locale masquée par proxy.", "dim");
    }
  }

  function progressBar(){
    const row = document.createElement("div");
    row.className = "row dim";
    row.textContent = "[..........] 0%";
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
    let p = 0;
    const iv = setInterval(()=>{
      p = Math.min(100, p + 10 + Math.random()*20);
      const filled = Math.round(p/10);
      row.textContent = "[" + "#".repeat(filled) + ".".repeat(10-filled) + "] " + Math.floor(p) + "%";
      logEl.scrollTop = logEl.scrollHeight;
      if (p >= 100) clearInterval(iv);
    }, 110);
    return { finish(){ clearInterval(iv); row.textContent = "[##########] 100%"; row.className="row ok"; } };
  }

  /* ============ TRACE (tension mécanique) ============ */

  function startTrace(){
    world.traceActive = true;
    world.trace = 0;
    print("⚠ CONTRE-MESURE ACTIVE : ce nœud trace ta connexion. root avant 100% !", "warn");
    if (world.traceTimer) clearInterval(world.traceTimer);
    world.traceTimer = setInterval(()=>{
      if (!world.traceActive) return;
      world.trace += 4 + Math.random()*3;
      updateHud();
      if (world.trace >= 100){
        world.trace = 100;
        updateHud();
        print("── TRAÇAGE COMPLET — DÉCONNEXION FORCÉE ──", "err");
        print("le pare-feu d'OmniCorp t'a expulsé. reconnecte-toi et réessaie plus vite.", "err");
        world.connected = null;
        world.cracked["94.22.10.13"] = new Set();
        stopTrace();
        updatePrompt();
      }
    }, 1000);
  }
  function stopTrace(){
    world.traceActive = false;
    world.trace = 0;
    if (world.traceTimer) clearInterval(world.traceTimer);
    updateHud();
  }

  /* ============ HUD + SIDE PANEL ============ */

  function updateHud(){
    document.getElementById("hud-credits").textContent = world.credits + " ¥";
    const traceEl = document.getElementById("hud-trace");
    const traceWrap = document.getElementById("hud-trace-wrap");
    traceEl.textContent = Math.floor(world.trace) + "%";
    traceWrap.classList.toggle("danger", world.trace >= 60);
  }

  function renderSide(){
    updateHud();
    // objectives
    const objEl = document.getElementById("objectives");
    objEl.innerHTML = "";
    let activeAssigned = false;
    objectives.forEach(o=>{
      const done = o.done();
      const div = document.createElement("div");
      div.className = "obj " + (done ? "done" : (!activeAssigned ? "active" : ""));
      if (!done && !activeAssigned) activeAssigned = true;
      div.innerHTML = `<span class="mark">${done?"✔":"○"}</span><span class="txt">${o.text}</span>`;
      objEl.appendChild(div);
    });

    // tools
    const toolsEl = document.getElementById("tools");
    toolsEl.innerHTML = "";
    world.owned_tools.forEach(t=>{
      const d = document.createElement("div");
      d.className = "tool";
      d.innerHTML = `<b>${t}</b><span>installé</span>`;
      toolsEl.appendChild(d);
    });

    renderMap();
  }

  function renderMap(){
    const el = document.getElementById("netmap");
    const ips = Object.keys(nodes);
    const w = 300, h = 300;
    let svg = `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">`;
    // links
    svg += `<line x1="30" y1="30" x2="${nodes["94.22.10.4"].x}" y2="${nodes["94.22.10.4"].y}" stroke="rgba(77,243,255,0.25)" stroke-width="1"/>`;
    if (discovered.has("94.22.10.9")) svg += `<line x1="${nodes["94.22.10.4"].x}" y1="${nodes["94.22.10.4"].y}" x2="${nodes["94.22.10.9"].x}" y2="${nodes["94.22.10.9"].y}" stroke="rgba(77,243,255,0.25)" stroke-width="1"/>`;
    if (discovered.has("94.22.10.13")) svg += `<line x1="${nodes["94.22.10.9"].x}" y1="${nodes["94.22.10.9"].y}" x2="${nodes["94.22.10.13"].x}" y2="${nodes["94.22.10.13"].y}" stroke="rgba(77,243,255,0.25)" stroke-width="1"/>`;

    // you
    svg += `<circle cx="30" cy="30" r="7" fill="#ff3fd8" opacity="0.9"/>`;
    svg += `<text x="30" y="18" text-anchor="middle" class="node-label" fill="#ff3fd8">TOI</text>`;

    ips.forEach(ip=>{
      const n = nodes[ip];
      const isDiscovered = discovered.has(ip);
      const isConnected = world.connected === ip;
      const isRooted = world.rooted[ip];
      let color = "#243944";
      if (isDiscovered) color = "#4df3ff";
      if (isConnected) color = "#ffcf5c";
      if (isRooted) color = "#59ffb0";
      const opacity = isDiscovered ? 1 : 0.35;
      svg += `<g opacity="${opacity}">`;
      if (isConnected){
        svg += `<circle cx="${n.x}" cy="${n.y}" r="13" fill="none" stroke="${color}" stroke-width="1"><animate attributeName="r" values="10;16;10" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.6s" repeatCount="indefinite"/></circle>`;
      }
      svg += `<rect x="${n.x-8}" y="${n.y-8}" width="16" height="16" fill="none" stroke="${color}" stroke-width="1.5" transform="rotate(45 ${n.x} ${n.y})"/>`;
      svg += `<circle cx="${n.x}" cy="${n.y}" r="3" fill="${color}"/>`;
      svg += `<text x="${n.x}" y="${n.y+22}" text-anchor="middle" class="node-label">${isDiscovered ? n.label : "??????"}</text>`;
      svg += `<text x="${n.x}" y="${n.y+32}" text-anchor="middle" class="node-ip">${isDiscovered ? ip : "0.0.0.0"}</text>`;
      svg += `</g>`;
    });
    svg += `</svg>`;
    el.innerHTML = svg;
  }

  /* ============ mobile drawer ============ */

  const side = document.getElementById("side");
  const backdrop = document.getElementById("side-backdrop");
  document.getElementById("menu-toggle").addEventListener("click", ()=>{
    side.classList.add("open"); backdrop.classList.add("open");
  });
  backdrop.addEventListener("click", ()=>{
    side.classList.remove("open"); backdrop.classList.remove("open");
  });

  /* ============ clock ============ */

  function tickClock(){
    const d = new Date();
    document.getElementById("hud-clock").textContent = d.toLocaleTimeString('fr-FR');
  }
  setInterval(tickClock, 1000);

  /* ============ init ============ */

  function initApp(){
    tickClock();
    updatePrompt();
    print("Bienvenue, GHOST_07. Le collectif 0x1B t'a confié PROJET CENDRE.", "sys");
    print("Tape 'missions' pour les objectifs, ou 'scan' pour commencer.", "dim");
    discovered = new Set();
    renderSide();
    cmdEl.focus();
  }

})();
</script>
</body>
</html>
