<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missions — Residential District</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0a0e15;
    --bg-panel:#121924;
    --bg-card:#161f2c;
    --bg-card-hover:#1c2635;
    --line:#26313f;
    --line-strong:#3a4a5c;
    --text-primary:#e7ecf3;
    --text-dim:#8a97a8;
    --magenta:#ff2d6b;
    --magenta-dim:#ff2d6b33;
    --cyan:#22e6ff;
    --cyan-dim:#22e6ff33;
    --amber:#ffb347;
    --red:#ff4d4d;
    --green:#3ddc84;
    --font-display:'Chakra Petch', sans-serif;
    --font-body:'Rajdhani', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-void);
    color:var(--text-primary);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* HUD */
  .hud{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:flex-end; align-items:center;
    padding:14px 22px;
    background:linear-gradient(180deg, rgba(10,14,21,0.85), rgba(10,14,21,0));
    z-index:50; pointer-events:none;
  }
  .hud-balance{
    font-family:var(--font-display); font-weight:700; font-size:20px;
    color:var(--amber);
    background:rgba(255,179,71,0.08);
    border:1px solid rgba(255,179,71,0.3);
    padding:6px 16px; border-radius:4px;
    pointer-events:auto;
  }

  /* Map scene */
  .scene{
    position:relative;
    width:100%; height:100vh;
    background:
      radial-gradient(circle at 50% 45%, #10151f, #05070b 70%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    padding:6vh 6vw;
    box-sizing:border-box;
  }
  .map-frame{
    position:relative;
    width:min(80vw, calc(72vh * 1024 / 572), 1100px);
    aspect-ratio:1024/572;
    background-image:url('plateau-tod.png');
    background-size:cover;
    background-position:center;
    border-radius:14px;
    box-shadow:
      0 30px 70px rgba(0,0,0,0.55),
      0 0 0 1px var(--line-strong),
      0 0 40px rgba(34,230,255,0.06);
  }

  /* Mission giver marker */
  .npc-spot{
    position:absolute;
    left:27.5%; top:5.2%;
    transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center;
  }
  .npc{
    position:relative;
    width:56px; height:56px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2a3446, #131a24 70%);
    border:2px solid var(--magenta);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 0 0 0 var(--magenta-dim);
    animation:pulse-ring 2.2s ease-out infinite;
    transition:transform .15s ease;
  }
  .npc:hover{ transform:scale(1.08); }
  .npc svg{ width:30px; height:30px; filter:drop-shadow(0 0 3px rgba(255,45,107,0.9)); }
  @keyframes pulse-ring{
    0%{ box-shadow:0 0 0 0 rgba(255,45,107,0.45); }
    70%{ box-shadow:0 0 0 18px rgba(255,45,107,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,45,107,0); }
  }
  .npc-name{
    margin-top:8px;
    font-size:13px; color:var(--text-primary); white-space:nowrap;
    letter-spacing:1px;
    text-shadow:0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6);
  }

  /* Overlay base */
  .overlay{
    position:fixed; inset:0;
    background:rgba(6,9,14,0.82);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center; justify-content:center;
    z-index:200;
    padding:20px;
  }
  .overlay.active{ display:flex; }

  /* Contracts panel */
  .panel{
    width:100%; max-width:640px;
    max-height:86vh; overflow-y:auto;
    background:var(--bg-panel);
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:0;
  }
  .panel-header{
    padding:20px 24px 14px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; background:var(--bg-panel); z-index:2;
  }
  .panel-header h2{
    font-family:var(--font-display); font-size:19px; font-weight:600;
    margin:0; letter-spacing:1px;
  }
  .panel-header span{ color:var(--text-dim); font-size:13px; }

  .contract-list{ padding:16px; display:flex; flex-direction:column; gap:10px; }
  .contract-card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
    position:relative;
  }
  .contract-card:hover{ border-color:var(--cyan); background:var(--bg-card-hover); }
  .contract-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .contract-title{
    font-family:var(--font-display); font-weight:600; font-size:15px;
    color:var(--text-primary); margin:0 0 4px;
  }
  .contract-meta{ display:flex; gap:10px; align-items:center; margin-top:6px; }
  .pips{ display:flex; gap:3px; }
  .pip{ width:9px; height:9px; border-radius:2px; background:var(--line-strong); }
  .pip.on{ background:var(--magenta); }
  .duration{ font-size:12px; color:var(--text-dim); }
  .reward{
    font-family:var(--font-display); font-weight:700; font-size:16px;
    color:var(--amber); white-space:nowrap;
  }
  .contract-desc{
    font-size:13px; color:var(--text-dim); margin:8px 0 0; line-height:1.4;
    display:none;
  }
  .contract-card.expanded .contract-desc{ display:block; }
  .contract-actions{
    display:none; gap:10px; margin-top:12px;
  }
  .contract-card.expanded .contract-actions{ display:flex; }
  .btn{
    font-family:var(--font-body); font-weight:600; font-size:13px;
    letter-spacing:0.5px; text-transform:uppercase;
    padding:8px 18px; border-radius:4px; cursor:pointer;
    border:1px solid var(--line-strong); background:transparent; color:var(--text-primary);
  }
  .btn-accept{ background:var(--magenta); border-color:var(--magenta); color:#1a0510; }
  .btn-accept:hover{ background:#ff5583; }
  .btn-accept:disabled{ background:var(--line-strong); border-color:var(--line-strong); color:var(--text-dim); cursor:not-allowed; }
  .btn-close{ background:transparent; }
  .btn-close:hover{ border-color:var(--text-primary); }

  .panel-footer{ padding:12px 24px 20px; text-align:center; font-size:12px; color:var(--text-dim); }

  /* Game overlay */
  .game-panel{
    width:100%; max-width:560px;
    background:var(--bg-panel);
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:22px 26px 26px;
    text-align:center;
  }
  .game-title{ font-family:var(--font-display); font-size:17px; font-weight:600; margin:0 0 4px; }
  .game-sub{ font-size:13px; color:var(--text-dim); margin:0 0 16px; }

  .timebar-track{
    width:100%; height:6px; background:var(--bg-card); border-radius:3px; overflow:hidden;
    margin-bottom:18px; border:1px solid var(--line);
  }
  .timebar-fill{
    height:100%; width:100%; background:var(--cyan);
    transition:width .1s linear, background .3s ease;
  }

  .pin-progress{ display:flex; justify-content:center; gap:6px; margin-bottom:16px; }
  .pin-dot{ width:10px; height:10px; border-radius:50%; background:var(--line-strong); border:1px solid var(--line); }
  .pin-dot.done{ background:var(--green); border-color:var(--green); }
  .pin-dot.current{ background:var(--cyan); border-color:var(--cyan); }
  .pin-dot.failed{ background:var(--red); border-color:var(--red); }

  .alarm-box{
    width:250px; aspect-ratio:1/1; margin:0 auto 18px;
    position:relative;
    background-image:url('alarm.png');
    background-size:cover; background-position:center;
    border-radius:16px;
    filter:drop-shadow(0 0 22px rgba(255,45,107,0.22));
  }
  .alarm-led-pulse{
    position:absolute; width:16px; height:16px; border-radius:50%;
    top:26%; left:73.8%; transform:translate(-50%,-50%);
    box-shadow:0 0 10px 4px rgba(255,77,77,0.85);
    animation:led-blink 1.1s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes led-blink{ 0%,100%{ opacity:1; } 50%{ opacity:0.15; } }
  .lock-dial{
    position:absolute; inset:0; width:100%; height:100%;
  }
  .lock-dial svg{ width:100%; height:100%; overflow:visible; }
  .lock-track-arc{ fill:none; stroke:rgba(0,0,0,0); stroke-width:0; }
  .lock-zone-arc{ fill:none; stroke:var(--green); stroke-width:3.5; stroke-linecap:round; filter:drop-shadow(0 0 4px rgba(61,220,132,0.9)); }
  .lock-needle-line{ stroke:var(--cyan); stroke-width:1.6; filter:drop-shadow(0 0 3px rgba(34,230,255,0.9)); }
  .lock-needle-tip{ fill:var(--cyan); filter:drop-shadow(0 0 4px rgba(34,230,255,0.95)); }
  .lock-base-dot{ fill:none; }

  .lock-hint{ font-size:12px; color:var(--text-dim); margin-bottom:14px; }
  .mistakes{ font-size:12px; color:var(--red); min-height:16px; margin-bottom:6px; }

  .building{
    width:290px; aspect-ratio:408/546; margin:0 auto 16px;
    background-image:url('immeuble.png');
    background-size:cover; background-position:center;
    border-radius:4px;
    position:relative;
    filter:drop-shadow(0 0 20px rgba(0,0,0,0.5));
  }
  .window-grid{
    position:absolute; inset:0;
  }
  .window-btn{
    position:absolute;
    width:6%; height:7.5%;
    transform:translate(-50%,-50%);
    border-radius:1px;
    border:1px solid transparent;
    background:rgba(0,0,0,0);
    cursor:pointer;
    transition:background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
    padding:0;
  }
  .window-btn:disabled{ cursor:default; }
  .window-btn.lit{ background-color:rgba(34,230,255,0.55); border-color:var(--cyan); box-shadow:0 0 10px 2px rgba(34,230,255,0.7); }
  .window-btn.correct{ background-color:rgba(61,220,132,0.55); border-color:var(--green); box-shadow:0 0 10px 2px rgba(61,220,132,0.7); }
  .window-btn.wrong{ background-color:rgba(255,77,77,0.55); border-color:var(--red); box-shadow:0 0 10px 2px rgba(255,77,77,0.7); }
  .memory-status{ font-size:13px; color:var(--cyan); margin:0 0 14px; min-height:18px; }

  .btn-lockpick{
    font-family:var(--font-display); font-weight:700; font-size:15px;
    letter-spacing:1px; text-transform:uppercase;
    padding:12px 30px; border-radius:4px; cursor:pointer;
    border:2px solid var(--cyan); background:var(--cyan-dim); color:var(--cyan);
    transition:transform .06s ease;
  }
  .btn-lockpick:active{ transform:scale(0.96); }

  /* Result screen */
  .result-icon{ font-family:var(--font-display); font-size:46px; font-weight:700; margin-bottom:6px; }
  .result-icon.win{ color:var(--green); }
  .result-icon.lose{ color:var(--red); }
  .result-amount{ font-family:var(--font-display); font-size:30px; font-weight:700; color:var(--amber); margin:12px 0; }
  .result-text{ font-size:14px; color:var(--text-dim); margin-bottom:20px; }

  .placeholder-note{
    font-size:12px; color:var(--text-dim); margin-top:8px; line-height:1.5;
  }

  /* Alarm triple mini-game */
  .panel-box{
    position:relative;
    width:230px; aspect-ratio:1/1; margin:0 auto 16px;
    background-size:cover; background-position:center;
    border-radius:16px;
    filter:drop-shadow(0 0 18px rgba(255,45,107,0.18));
  }
  .panel-hotspot{
    position:absolute; width:15%; height:15%;
    transform:translate(-50%,-50%);
    cursor:pointer; background:transparent; border:2px solid transparent;
    border-radius:50%; padding:0; transition:box-shadow .15s ease, border-color .15s ease;
  }
  .panel-hotspot:disabled{ cursor:default; }
  .panel-hotspot.hs-correct{ border-color:var(--green); box-shadow:0 0 12px 2px rgba(61,220,132,0.7); }
  .panel-hotspot.hs-wrong{ border-color:var(--red); box-shadow:0 0 12px 2px rgba(255,77,77,0.7); }

  .color-sequence{ display:flex; justify-content:center; gap:12px; margin-bottom:14px; }
  .color-dot{
    width:20px; height:20px; border-radius:50%;
    background:var(--line-strong); border:2px solid var(--line);
    transition:box-shadow .15s ease, transform .15s ease, background .15s ease;
  }
  .color-dot.lit{ transform:scale(1.2); box-shadow:0 0 14px 5px currentColor; background:currentColor; }
  .color-dot.c-magenta{ color:var(--magenta); }
  .color-dot.c-cyan{ color:var(--cyan); }
  .color-dot.c-green{ color:var(--green); }
  .color-dot.c-amber{ color:var(--amber); }

  .binary-screen{
    position:absolute; background:#04181c; border-radius:4px;
    display:flex; justify-content:space-around; align-items:center;
    box-shadow:inset 0 0 12px rgba(0,0,0,0.6);
  }
  .binary-bit{
    font-family:var(--font-display); font-weight:700; font-size:20px;
    color:var(--cyan); text-shadow:0 0 8px rgba(34,230,255,0.8);
  }
  .binary-led{
    position:absolute; width:11%; height:11%; border-radius:50%;
    background:#3a1418; transform:translate(-50%,-50%);
    transition:background .15s ease, box-shadow .15s ease;
  }
  .binary-led.on{ background:var(--cyan); box-shadow:0 0 8px 2px rgba(34,230,255,0.85); }

  .code-screen{
    position:absolute; background:#241405; border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 12px rgba(0,0,0,0.6);
  }
  .code-screen-text{
    font-family:var(--font-display); font-weight:700; font-size:24px;
    letter-spacing:6px; color:var(--amber); text-shadow:0 0 10px rgba(255,179,71,0.85);
  }

  .game-panel.critical{ animation:critical-pulse .6s ease-in-out infinite; }
  @keyframes critical-pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,77,77,0); }
    50%{ box-shadow:0 0 34px 8px rgba(255,77,77,0.35); }
  }
</style>
</head>
<body>

<div class="hud">
  <div class="hud-balance" id="balance">$0</div>
</div>

<div class="scene">
  <div class="map-frame">
    <div class="npc-spot">
      <div class="npc" id="npc-btn">
        <svg viewBox="0 0 24 24" fill="var(--magenta)">
          <path d="M12 2.2c-2.6 0-4.3 2-4.3 4.3 0 1.1.4 2 1 2.7C7 10.1 5.7 11.7 5.7 13.6V14h12.6v-.4c0-1.9-1.3-3.5-3-4.4.6-.7 1-1.6 1-2.7 0-2.3-1.7-4.3-4.3-4.3z"/>
          <path d="M3.6 21.4c0-3.6 3.8-6.5 8.4-6.5s8.4 2.9 8.4 6.5v.4H3.6v-.4z"/>
        </svg>
      </div>
      <div class="npc-name">Contact — Contrats</div>
    </div>
  </div>
</div>

<div class="overlay" id="contracts-overlay">
  <div class="panel">
    <div class="panel-header">
      <h2>Contrats disponibles</h2>
      <span>Residential District</span>
    </div>
    <div class="contract-list" id="contract-list"></div>
    <div class="panel-footer">Cliquez en dehors du panneau pour fermer</div>
  </div>
</div>

<div class="overlay" id="game-overlay">
  <div class="game-panel" id="game-panel"></div>
</div>

<script>
const MISSIONS = [
  {
    id: 1,
    title: "Cambriolage discret — pavillon Elm Street",
    difficulty: 1,
    duration: "≈ 1 min",
    reward: 250,
    desc: "Un pavillon isolé, peu surveillé. La porte arrière a une serrure vieillissante à plusieurs gorges. Crochetez-la sans vous faire remarquer.",
    game: "lockpick",
    pins: 6,
    timeLimit: 75,
    maxMistakes: 3
  },
  {
    id: 2,
    title: "Repérage nocturne — Immeuble Maple",
    difficulty: 2,
    duration: "≈ 1min30-2min",
    reward: 450,
    desc: "Avant le casse, il faut repérer quel appartement laisse ses lumières allumées selon un schéma précis, plusieurs nuits de suite.",
    game: "memory",
    rounds: 5,
    sequenceLengths: [2, 3, 4, 5, 6],
    gridCols: 8,
    gridRows: 4,
    timeLimit: 100,
    maxMistakes: 3
  },
  {
    id: 3,
    title: "Neutralisation — Alarme triple",
    difficulty: 3,
    duration: "≈ 2min30",
    reward: 700,
    desc: "Trois boîtiers d'alarme reliés protègent la maison des Kowalski. Désamorcez-les dans le bon ordre avant l'expiration du délai.",
    game: "alarm",
    timeLimit: 150,
    maxMistakes: 4,
    panels: [
      { type: "color", length: 4 },
      { type: "binary", bits: 6 },
      { type: "code", digits: 4 }
    ]
  },
  {
    id: 4,
    title: "Infiltration silencieuse — Résidence Ashcroft",
    difficulty: 4,
    duration: "≈ 3 min",
    reward: 950,
    desc: "Deux gardes patrouillent la propriété sur trois niveaux. Récupérez l'objet dans le bureau et ressortez sans déclencher d'alerte.",
    game: "soon",
    pins: 0
  },
  {
    id: 5,
    title: "Casse complet — Manoir Whitfield",
    difficulty: 5,
    duration: "≈ 4 min",
    reward: 1250,
    desc: "Le gros coup du quartier. Crochetage, repérage, désamorçage et infiltration enchaînés, avec la police qui se rapproche.",
    game: "soon",
    pins: 0
  }
];

let balance = 0;
function addBalance(amount){
  balance += amount;
  document.getElementById('balance').textContent = '$' + balance;
}

const listEl = document.getElementById('contract-list');
MISSIONS.forEach(m => {
  const card = document.createElement('div');
  card.className = 'contract-card';
  const pips = Array.from({length:5}, (_,i) =>
    `<div class="pip ${i < m.difficulty ? 'on' : ''}"></div>`
  ).join('');
  card.innerHTML = `
    <div class="contract-top">
      <div>
        <p class="contract-title">${m.title}</p>
        <div class="contract-meta">
          <div class="pips">${pips}</div>
          <span class="duration">${m.duration}</span>
        </div>
      </div>
      <div class="reward">$${m.reward}</div>
    </div>
    <p class="contract-desc">${m.desc}</p>
    <div class="contract-actions">
      <button class="btn btn-accept" ${m.game === 'soon' ? 'disabled' : ''}>
        ${m.game === 'soon' ? 'Bientôt disponible' : 'Accepter le contrat'}
      </button>
      <button class="btn btn-close">Fermer</button>
    </div>
  `;
  card.addEventListener('click', (e) => {
    if (e.target.classList.contains('btn-accept')) {
      if (m.game !== 'soon') startMission(m);
      return;
    }
    if (e.target.classList.contains('btn-close')) {
      card.classList.remove('expanded');
      return;
    }
    document.querySelectorAll('.contract-card.expanded').forEach(c => {
      if (c !== card) c.classList.remove('expanded');
    });
    card.classList.toggle('expanded');
  });
  listEl.appendChild(card);
});

const contractsOverlay = document.getElementById('contracts-overlay');
document.getElementById('npc-btn').addEventListener('click', () => {
  contractsOverlay.classList.add('active');
});
contractsOverlay.addEventListener('click', (e) => {
  if (e.target === contractsOverlay) contractsOverlay.classList.remove('active');
});

const gameOverlay = document.getElementById('game-overlay');
const gamePanel = document.getElementById('game-panel');
let activeCleanup = null; // fonction pour stopper proprement la mission en cours

function closeGameOverlay(){
  if (activeCleanup){
    activeCleanup();
    activeCleanup = null;
  }
  gamePanel.dataset.locked = 'false';
  gameOverlay.classList.remove('active');
}

function startMission(mission){
  contractsOverlay.classList.remove('active');
  gameOverlay.classList.add('active');
  if (mission.game === 'lockpick') renderLockpick(mission);
  if (mission.game === 'memory') renderMemory(mission);
  if (mission.game === 'alarm') renderAlarm(mission);
}

gameOverlay.addEventListener('click', (e) => {
  if (e.target === gameOverlay) {
    closeGameOverlay();
  }
});

function renderLockpick(mission){
  gamePanel.dataset.locked = 'true';
  gamePanel.innerHTML = `
    <h3 class="game-title">Crochetage — ${mission.title}</h3>
    <p class="game-sub">Appuyez sur ESPACE ou cliquez quand l'aiguille est dans la zone verte</p>
    <div class="timebar-track"><div class="timebar-fill" id="timebar"></div></div>
    <div class="pin-progress" id="pin-progress"></div>
    <div class="alarm-box">
      <div class="alarm-led-pulse"></div>
      <div class="lock-dial">
        <svg viewBox="0 0 100 100">
          <path class="lock-zone-arc" id="lock-zone" d=""></path>
          <line class="lock-needle-line" id="lock-needle" x1="49.3" y1="24.4" x2="49.3" y2="49.8"></line>
          <circle class="lock-needle-tip" id="lock-needle-tip" cx="49.3" cy="24.4" r="2.4"></circle>
        </svg>
      </div>
    </div>
    <div class="mistakes" id="mistakes-text"></div>
    <button class="btn-lockpick" id="lock-btn">Verrouiller</button>
  `;

  const totalPins = mission.pins;
  const pinProgress = document.getElementById('pin-progress');
  for (let i = 0; i < totalPins; i++){
    const dot = document.createElement('div');
    dot.className = 'pin-dot' + (i === 0 ? ' current' : '');
    dot.id = 'pin-dot-' + i;
    pinProgress.appendChild(dot);
  }

  let currentPin = 0;
  let mistakes = 0;
  const maxMistakes = mission.maxMistakes;
  let timeLeft = mission.timeLimit;
  let angle = 0;
  let speed = 1.4;
  let direction = 1;
  let zoneMin, zoneMax;
  let running = true;

  const needle = document.getElementById('lock-needle');
  const needleTip = document.getElementById('lock-needle-tip');
  const zoneEl = document.getElementById('lock-zone');
  const timebar = document.getElementById('timebar');
  const mistakesText = document.getElementById('mistakes-text');
  const lockBtn = document.getElementById('lock-btn');

  const DIAL_CX = 49.3, DIAL_CY = 49.8, DIAL_R = 25.4;

  function polar(deg, radius){
    const rad = (deg * Math.PI) / 180;
    return { x: DIAL_CX + radius * Math.sin(rad), y: DIAL_CY - radius * Math.cos(rad) };
  }

  function newZone(){
    const width = Math.max(14, 26 - currentPin * 2);
    const min = Math.random() * (360 - width);
    zoneMin = min;
    zoneMax = min + width;
    const pMin = polar(zoneMin, DIAL_R);
    const pMax = polar(zoneMax, DIAL_R);
    zoneEl.setAttribute('d', `M${pMin.x},${pMin.y} A${DIAL_R},${DIAL_R} 0 0,1 ${pMax.x},${pMax.y}`);
    speed = 3.2 + currentPin * 0.8;
  }
  newZone();

  let lastTime = null;
  function tick(now){
    if (!running) return;
    if (lastTime === null) lastTime = now;
    const dt = (now - lastTime) / 1000; // secondes écoulées depuis la frame précédente
    lastTime = now;

    // speed reste "en degrés par frame à 60fps" comme avant, mais calé sur le temps réel
    angle = (angle + speed * 60 * dt) % 360;
    const p = polar(angle, DIAL_R);
    const pInner = polar(angle, 7.5);
    needle.setAttribute('x1', pInner.x);
    needle.setAttribute('y1', pInner.y);
    needle.setAttribute('x2', p.x);
    needle.setAttribute('y2', p.y);
    needleTip.setAttribute('cx', p.x);
    needleTip.setAttribute('cy', p.y);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  const timerInt = setInterval(() => {
    if (!running) return;
    timeLeft -= 0.1;
    const pct = Math.max(0, (timeLeft / mission.timeLimit) * 100);
    timebar.style.width = pct + '%';
    if (pct < 30) timebar.style.background = 'var(--red)';
    else if (pct < 60) timebar.style.background = 'var(--amber)';
    if (timeLeft <= 0){
      running = false;
      clearInterval(timerInt);
      endMission(false, mission);
    }
  }, 100);

  function attemptLock(){
    if (!running) return;
    const inZone = angle >= zoneMin && angle <= zoneMax;

    if (inZone){
      document.getElementById('pin-dot-' + currentPin).classList.remove('current');
      document.getElementById('pin-dot-' + currentPin).classList.add('done');
      currentPin++;
      if (currentPin >= totalPins){
        running = false;
        clearInterval(timerInt);
        endMission(true, mission);
        return;
      }
      document.getElementById('pin-dot-' + currentPin).classList.add('current');
      newZone();
    } else {
      mistakes++;
      mistakesText.textContent = `Erreur ${mistakes}/${maxMistakes}`;
      if (mistakes >= maxMistakes){
        running = false;
        clearInterval(timerInt);
        endMission(false, mission);
      }
    }
  }

  lockBtn.addEventListener('click', attemptLock);
  function keyHandler(e){
    if (e.code === 'Space'){
      e.preventDefault();
      attemptLock();
    }
  }
  document.addEventListener('keydown', keyHandler);

  activeCleanup = function(){
    running = false;
    clearInterval(timerInt);
    document.removeEventListener('keydown', keyHandler);
  };

  function endMission(won, mission){
    document.removeEventListener('keydown', keyHandler);
    activeCleanup = null;
    if (won) addBalance(mission.reward);
    gamePanel.dataset.locked = 'false';
    gamePanel.innerHTML = `
      <div class="result-icon ${won ? 'win' : 'lose'}">${won ? 'CONTRAT REMPLI' : 'ECHEC'}</div>
      ${won
        ? `<div class="result-amount">+ $${mission.reward}</div>
           <p class="result-text">Serrure crochetée sans alerter le voisinage.</p>`
        : `<p class="result-text">Trop d'erreurs ou temps écoulé. La cible a été perdue.</p>`
      }
      <button class="btn btn-accept" id="close-result" style="background:var(--line-strong);border-color:var(--line-strong);color:var(--text-primary)">Fermer</button>
    `;
    document.getElementById('close-result').addEventListener('click', () => {
      closeGameOverlay();
    });
  }
}

function renderMemory(mission){
  gamePanel.dataset.locked = 'true';
  const totalWindows = mission.gridCols * mission.gridRows;
  gamePanel.innerHTML = `
    <h3 class="game-title">Repérage — ${mission.title}</h3>
    <p class="game-sub">Mémorisez les fenêtres qui s'allument, puis recliquez-les dans le même ordre</p>
    <div class="timebar-track"><div class="timebar-fill" id="timebar"></div></div>
    <div class="pin-progress" id="round-progress"></div>
    <p class="memory-status" id="memory-status">Préparez-vous...</p>
    <div class="building">
      <div class="window-grid" id="window-grid"></div>
    </div>
    <div class="mistakes" id="mistakes-text"></div>
  `;

  const roundProgress = document.getElementById('round-progress');
  for (let i = 0; i < mission.rounds; i++){
    const dot = document.createElement('div');
    dot.className = 'pin-dot' + (i === 0 ? ' current' : '');
    dot.id = 'round-dot-' + i;
    roundProgress.appendChild(dot);
  }

  const gridEl = document.getElementById('window-grid');
  const statusEl = document.getElementById('memory-status');
  const timebar = document.getElementById('timebar');
  const mistakesText = document.getElementById('mistakes-text');
  // positions calées sur les fenêtres réelles de assets/immeuble.jpg
  // (les 2 colonnes de chaque tour, on saute la colonne centrale = cage d'escalier)
  const WINDOW_COLS = [8.2, 19.9, 30.0, 42.0, 57.8, 70.2, 80.3, 91.9];
  const WINDOW_ROWS = [29.6, 43.0, 56.9, 70.6];
  const windowBtns = [];
  let i = 0;
  WINDOW_ROWS.forEach(rowPct => {
    WINDOW_COLS.forEach(colPct => {
      const btn = document.createElement('button');
      btn.className = 'window-btn';
      btn.style.left = colPct + '%';
      btn.style.top = rowPct + '%';
      btn.disabled = true;
      const idx = i;
      btn.addEventListener('click', () => handleWindowClick(idx));
      gridEl.appendChild(btn);
      windowBtns.push(btn);
      i++;
    });
  });

  let currentRound = 0;
  let mistakes = 0;
  const maxMistakes = mission.maxMistakes;
  let timeLeft = mission.timeLimit;
  let sequence = [];
  let inputIndex = 0;
  let running = true;
  let phase = 'idle';
  const pendingTimeouts = [];

  function clearPending(){
    pendingTimeouts.forEach(t => clearTimeout(t));
    pendingTimeouts.length = 0;
  }

  function setButtonsEnabled(enabled){
    windowBtns.forEach(b => { b.disabled = !enabled; });
  }

  function randomSequence(length){
    const pool = Array.from({length: totalWindows}, (_, i) => i);
    for (let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, length);
  }

  function startRound(){
    if (!running) return;
    clearPending();
    windowBtns.forEach(b => b.className = 'window-btn');
    inputIndex = 0;
    phase = 'playback';
    setButtonsEnabled(false);
    sequence = randomSequence(mission.sequenceLengths[currentRound]);
    statusEl.textContent = 'Mémorisez la séquence...';

    sequence.forEach((idx, step) => {
      const onDelay = step * 750;
      const offDelay = onDelay + 500;
      pendingTimeouts.push(setTimeout(() => {
        if (!running) return;
        windowBtns[idx].classList.add('lit');
      }, onDelay));
      pendingTimeouts.push(setTimeout(() => {
        if (!running) return;
        windowBtns[idx].classList.remove('lit');
      }, offDelay));
    });

    const totalPlayback = sequence.length * 750 + 200;
    pendingTimeouts.push(setTimeout(() => {
      if (!running) return;
      phase = 'input';
      setButtonsEnabled(true);
      statusEl.textContent = 'À vous — recliquez la séquence';
    }, totalPlayback));
  }

  function handleWindowClick(idx){
    const btn = windowBtns[idx];
    if (btn.disabled || !running || phase !== 'input') return;
    const expected = sequence[inputIndex];
    if (idx === expected){
      windowBtns[idx].classList.add('correct');
      inputIndex++;
      if (inputIndex >= sequence.length){
        document.getElementById('round-dot-' + currentRound).classList.remove('current');
        document.getElementById('round-dot-' + currentRound).classList.add('done');
        currentRound++;
        if (currentRound >= mission.rounds){
          running = false;
          clearPending();
          clearInterval(timerInt);
          endMemoryMission(true, mission);
          return;
        }
        document.getElementById('round-dot-' + currentRound).classList.add('current');
        setButtonsEnabled(false);
        statusEl.textContent = 'Manche suivante...';
        pendingTimeouts.push(setTimeout(startRound, 900));
      }
    } else {
      windowBtns[idx].classList.add('wrong');
      mistakes++;
      mistakesText.textContent = `Erreur ${mistakes}/${maxMistakes}`;
      setButtonsEnabled(false);
      if (mistakes >= maxMistakes){
        running = false;
        clearPending();
        clearInterval(timerInt);
        endMemoryMission(false, mission);
        return;
      }
      statusEl.textContent = 'Raté — on refait cette manche';
      pendingTimeouts.push(setTimeout(startRound, 1100));
    }
  }

  const timerInt = setInterval(() => {
    if (!running) return;
    timeLeft -= 0.1;
    const pct = Math.max(0, (timeLeft / mission.timeLimit) * 100);
    timebar.style.width = pct + '%';
    if (pct < 30) timebar.style.background = 'var(--red)';
    else if (pct < 60) timebar.style.background = 'var(--amber)';
    if (timeLeft <= 0){
      running = false;
      clearPending();
      clearInterval(timerInt);
      endMemoryMission(false, mission);
    }
  }, 100);

  startRound();

  activeCleanup = function(){
    running = false;
    clearPending();
    clearInterval(timerInt);
  };

  function endMemoryMission(won, mission){
    activeCleanup = null;
    if (won) addBalance(mission.reward);
    gamePanel.dataset.locked = 'false';
    gamePanel.innerHTML = `
      <div class="result-icon ${won ? 'win' : 'lose'}">${won ? 'CONTRAT REMPLI' : 'ECHEC'}</div>
      ${won
        ? `<div class="result-amount">+ $${mission.reward}</div>
           <p class="result-text">Le schéma des lumières a été percé à jour.</p>`
        : `<p class="result-text">Trop d'erreurs ou temps écoulé. Le repérage a échoué.</p>`
      }
      <button class="btn btn-accept" id="close-result-mem" style="background:var(--line-strong);border-color:var(--line-strong);color:var(--text-primary)">Fermer</button>
    `;
    document.getElementById('close-result-mem').addEventListener('click', () => {
      closeGameOverlay();
    });
  }
}

/* ============================================================
   MISSION 3 — Neutralisation, Alarme triple (3 boîtiers)
   ============================================================ */
function renderAlarm(mission){
  gamePanel.dataset.locked = 'true';
  gamePanel.classList.remove('critical');
  gamePanel.innerHTML = `
    <h3 class="game-title">Neutralisation — ${mission.title}</h3>
    <p class="game-sub" id="alarm-sub">Désamorcez les 3 boîtiers avant la fin du délai</p>
    <div class="timebar-track"><div class="timebar-fill" id="timebar"></div></div>
    <div class="pin-progress" id="alarm-progress"></div>
    <div id="alarm-stage"></div>
    <div class="mistakes" id="mistakes-text"></div>
  `;

  const progressEl = document.getElementById('alarm-progress');
  mission.panels.forEach((p, i) => {
    const dot = document.createElement('div');
    dot.className = 'pin-dot' + (i === 0 ? ' current' : '');
    dot.id = 'alarm-dot-' + i;
    progressEl.appendChild(dot);
  });

  const stageEl = document.getElementById('alarm-stage');
  const subEl = document.getElementById('alarm-sub');
  const mistakesText = document.getElementById('mistakes-text');
  const timebar = document.getElementById('timebar');

  let currentStage = 0;
  let mistakes = 0;
  const maxMistakes = mission.maxMistakes;
  let timeLeft = mission.timeLimit;
  let running = true;
  let stageCleanup = null;

  const timerInt = setInterval(() => {
    if (!running) return;
    timeLeft -= 0.1;
    const pct = Math.max(0, (timeLeft / mission.timeLimit) * 100);
    timebar.style.width = pct + '%';
    if (pct < 30) timebar.style.background = 'var(--red)';
    else if (pct < 60) timebar.style.background = 'var(--amber)';
    if (pct < 20) gamePanel.classList.add('critical');
    if (timeLeft <= 0){
      running = false;
      clearInterval(timerInt);
      if (stageCleanup) stageCleanup();
      endAlarmMission(false, mission);
    }
  }, 100);

  activeCleanup = function(){
    running = false;
    clearInterval(timerInt);
    if (stageCleanup) stageCleanup();
  };

  function registerMistake(){
    mistakes++;
    mistakesText.textContent = `Erreur ${mistakes}/${maxMistakes}`;
    if (mistakes >= maxMistakes){
      running = false;
      clearInterval(timerInt);
      if (stageCleanup) stageCleanup();
      endAlarmMission(false, mission);
      return true;
    }
    return false;
  }

  function stageSuccess(){
    document.getElementById('alarm-dot-' + currentStage).classList.remove('current');
    document.getElementById('alarm-dot-' + currentStage).classList.add('done');
    currentStage++;
    if (currentStage >= mission.panels.length){
      running = false;
      clearInterval(timerInt);
      endAlarmMission(true, mission);
      return;
    }
    document.getElementById('alarm-dot-' + currentStage).classList.add('current');
    renderStage();
  }

  function renderStage(){
    stageEl.innerHTML = '';
    const panel = mission.panels[currentStage];
    const isRunning = () => running;
    if (panel.type === 'color') stageCleanup = renderColorStage(stageEl, subEl, panel, isRunning, stageSuccess, registerMistake);
    if (panel.type === 'binary') stageCleanup = renderBinaryStage(stageEl, subEl, panel, isRunning, stageSuccess, registerMistake);
    if (panel.type === 'code') stageCleanup = renderCodeStage(stageEl, subEl, panel, isRunning, stageSuccess, registerMistake);
  }
  renderStage();

  function endAlarmMission(won, mission){
    activeCleanup = null;
    gamePanel.classList.remove('critical');
    if (won) addBalance(mission.reward);
    gamePanel.dataset.locked = 'false';
    gamePanel.innerHTML = `
      <div class="result-icon ${won ? 'win' : 'lose'}">${won ? 'CONTRAT REMPLI' : 'ECHEC'}</div>
      ${won
        ? `<div class="result-amount">+ $${mission.reward}</div>
           <p class="result-text">Les trois boîtiers ont été neutralisés à temps.</p>`
        : `<p class="result-text">Trop d'erreurs ou temps écoulé. L'alarme s'est déclenchée.</p>`
      }
      <button class="btn btn-accept" id="close-result-alarm" style="background:var(--line-strong);border-color:var(--line-strong);color:var(--text-primary)">Fermer</button>
    `;
    document.getElementById('close-result-alarm').addEventListener('click', () => {
      closeGameOverlay();
    });
  }
}

/* --- Boîtier 1 : câbles colorés (Simon des couleurs) --- */
function renderColorStage(container, subEl, panelConfig, isRunning, onSuccess, onMistake){
  const COLORS = [
    { cls: 'c-magenta' },
    { cls: 'c-cyan' },
    { cls: 'c-green' },
    { cls: 'c-amber' }
  ];
  const HOTSPOTS = [
    { x: 20.2, y: 75.0 },
    { x: 33.3, y: 79.8 },
    { x: 64.3, y: 79.8 },
    { x: 76.2, y: 75.0 }
  ];

  container.innerHTML = `
    <div class="color-sequence" id="color-sequence"></div>
    <div class="panel-box" id="color-box" style="background-image:url('boitier-couleur.png')"></div>
  `;

  const seqEl = document.getElementById('color-sequence');
  const boxEl = document.getElementById('color-box');
  const dots = COLORS.map(c => {
    const d = document.createElement('div');
    d.className = 'color-dot ' + c.cls;
    seqEl.appendChild(d);
    return d;
  });

  const hotspotBtns = HOTSPOTS.map((h, idx) => {
    const btn = document.createElement('button');
    btn.className = 'panel-hotspot';
    btn.style.left = h.x + '%';
    btn.style.top = h.y + '%';
    btn.disabled = true;
    btn.addEventListener('click', () => handleClick(idx));
    boxEl.appendChild(btn);
    return btn;
  });

  let sequence = [];
  let inputIndex = 0;
  const pending = [];

  function clearPending(){ pending.forEach(t => clearTimeout(t)); pending.length = 0; }
  function setEnabled(enabled){ hotspotBtns.forEach(b => b.disabled = !enabled); }
  function randomSequence(len){
    const arr = [];
    for (let i = 0; i < len; i++) arr.push(Math.floor(Math.random() * 4));
    return arr;
  }

  function playSequence(){
    if (!isRunning()) return;
    clearPending();
    hotspotBtns.forEach(b => b.classList.remove('hs-correct', 'hs-wrong'));
    inputIndex = 0;
    setEnabled(false);
    subEl.textContent = 'Mémorisez l\'ordre des couleurs...';
    sequence = randomSequence(panelConfig.length);
    sequence.forEach((colorIdx, step) => {
      const onDelay = step * 650;
      const offDelay = onDelay + 420;
      pending.push(setTimeout(() => { if (isRunning()) dots[colorIdx].classList.add('lit'); }, onDelay));
      pending.push(setTimeout(() => { if (isRunning()) dots[colorIdx].classList.remove('lit'); }, offDelay));
    });
    const total = sequence.length * 650 + 300;
    pending.push(setTimeout(() => {
      if (!isRunning()) return;
      setEnabled(true);
      subEl.textContent = 'À vous — reproduisez l\'ordre sur le boîtier';
    }, total));
  }

  function handleClick(idx){
    if (!isRunning()) return;
    const expected = sequence[inputIndex];
    if (idx === expected){
      hotspotBtns[idx].classList.add('hs-correct');
      inputIndex++;
      if (inputIndex >= sequence.length){
        setEnabled(false);
        pending.push(setTimeout(() => { if (isRunning()) onSuccess(); }, 400));
      }
    } else {
      hotspotBtns[idx].classList.add('hs-wrong');
      setEnabled(false);
      const failed = onMistake();
      if (failed) return;
      subEl.textContent = 'Raté — on recommence cette séquence';
      pending.push(setTimeout(() => { if (isRunning()) playSequence(); }, 1000));
    }
  }

  playSequence();

  return function cleanup(){ clearPending(); };
}

/* --- Boîtier 2 : code binaire (interrupteurs) --- */
function renderBinaryStage(container, subEl, panelConfig, isRunning, onSuccess, onMistake){
  const bits = panelConfig.bits;
  const SWITCH_X = [15.5, 28.6, 42.1, 55.2, 68.6, 81.7];
  const SWITCH_Y = 67.9;
  const LED_Y = 82.1;

  const target = Array.from({ length: bits }, () => (Math.random() < 0.5 ? 1 : 0));
  const state = Array(bits).fill(0);

  subEl.textContent = 'Reproduisez le code binaire affiché avec les interrupteurs';

  container.innerHTML = `
    <div class="panel-box" id="binary-box" style="background-image:url('boitier-binaire.png')">
      <div class="binary-screen" id="binary-screen" style="left:9%; top:18%; width:82%; height:29%;"></div>
    </div>
    <button class="btn-lockpick" id="binary-validate" style="margin-top:14px;">Valider</button>
  `;

  const boxEl = document.getElementById('binary-box');
  const screenEl = document.getElementById('binary-screen');
  target.forEach(bit => {
    const s = document.createElement('span');
    s.className = 'binary-bit';
    s.textContent = bit;
    screenEl.appendChild(s);
  });

  const leds = [];
  for (let i = 0; i < bits; i++){
    const btn = document.createElement('button');
    btn.className = 'panel-hotspot';
    btn.style.left = SWITCH_X[i] + '%';
    btn.style.top = SWITCH_Y + '%';
    btn.addEventListener('click', () => toggleSwitch(i));
    boxEl.appendChild(btn);

    const led = document.createElement('div');
    led.className = 'binary-led';
    led.style.left = SWITCH_X[i] + '%';
    led.style.top = LED_Y + '%';
    boxEl.appendChild(led);
    leds.push(led);
  }

  function toggleSwitch(i){
    if (!isRunning()) return;
    state[i] = state[i] ? 0 : 1;
    leds[i].classList.toggle('on', state[i] === 1);
  }

  const validateBtn = document.getElementById('binary-validate');
  function validate(){
    if (!isRunning()) return;
    const match = state.every((v, i) => v === target[i]);
    if (match){
      validateBtn.disabled = true;
      onSuccess();
    } else {
      onMistake();
    }
  }
  validateBtn.addEventListener('click', validate);

  return function cleanup(){};
}

/* --- Boîtier 3 : code à mémoriser (clavier) --- */
function renderCodeStage(container, subEl, panelConfig, isRunning, onSuccess, onMistake){
  const digits = panelConfig.digits;
  const code = Array.from({ length: digits }, () => Math.floor(Math.random() * 10));
  const codeStr = code.join('');

  const KEYS = [
    { label: '1', x: 28.6, y: 39.3 }, { label: '2', x: 50, y: 39.3 }, { label: '3', x: 71.4, y: 39.3 },
    { label: '4', x: 28.6, y: 56 }, { label: '5', x: 50, y: 56 }, { label: '6', x: 71.4, y: 56 },
    { label: '*', x: 28.6, y: 72.6 }, { label: '0', x: 50, y: 72.6 }, { label: '#', x: 71.4, y: 72.6 }
  ];

  container.innerHTML = `
    <div class="panel-box" id="code-box" style="background-image:url('boitier-code.png')">
      <div class="code-screen" id="code-screen" style="left:16.7%; top:13.1%; width:66.7%; height:11.9%;">
        <span class="code-screen-text" id="code-screen-text"></span>
      </div>
    </div>
  `;

  const boxEl = document.getElementById('code-box');
  const screenText = document.getElementById('code-screen-text');
  screenText.textContent = codeStr;
  subEl.textContent = 'Mémorisez le code...';

  let input = '';
  const pending = [];

  KEYS.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'panel-hotspot';
    btn.style.left = k.x + '%';
    btn.style.top = k.y + '%';
    btn.disabled = true;
    btn.addEventListener('click', () => handleKey(k.label));
    boxEl.appendChild(btn);
  });

  function handleKey(label){
    if (!isRunning()) return;
    if (label === '*'){ input = ''; screenText.textContent = '_'.repeat(digits); return; }
    if (label === '#') return;
    input += label;
    screenText.textContent = input.padEnd(digits, '_');
    if (input.length >= digits){
      if (input === codeStr){
        onSuccess();
      } else {
        const failed = onMistake();
        input = '';
        if (!failed){
          subEl.textContent = 'Code erroné — recommencez';
          screenText.textContent = '_'.repeat(digits);
        }
      }
    }
  }

  const revealTimeout = setTimeout(() => {
    if (!isRunning()) return;
    screenText.textContent = '_'.repeat(digits);
    subEl.textContent = 'À vous — entrez le code de mémoire';
    boxEl.querySelectorAll('.panel-hotspot').forEach(b => b.disabled = false);
  }, 3000);
  pending.push(revealTimeout);

  return function cleanup(){ pending.forEach(t => clearTimeout(t)); };
}
</script>
